  user: null,        /* { id, email, nom } */
  statut: null,      /* en_attente | approuve | refuse */
  pret: false,       /* la vérification est terminée */
  erreur: null
};

const TOK_KEY = "darhlou.session";

/* ---------- utilitaires ---------- */
function b64urlDecode(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  try { return decodeURIComponent(escape(atob(s))); } catch (e) { return null; }
}
function jwtPayload(tok) {
  if (!tok) return null;
  const parts = String(tok).split(".");
  if (parts.length < 2) return null;
  const raw = b64urlDecode(parts[1]);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}
function saveSession(s) {
  AUTH.session = s;
  try {
    if (s) localStorage.setItem(TOK_KEY, JSON.stringify(s));
    else localStorage.removeItem(TOK_KEY);
  } catch (e) { /* quota */ }
}
function loadSession() {
  try {
    const raw = localStorage.getItem(TOK_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    return s && s.access_token ? s : null;
  } catch (e) { return null; }
}

/* ---------- appels HTTP ---------- */
async function supaFetch(path, opts) {
  opts = opts || {};
  const h = Object.assign({
    "apikey": SUPA.key,
    "Content-Type": "application/json"
  }, opts.headers || {});
  if (AUTH.session && AUTH.session.access_token && !opts.anon) {
    h["Authorization"] = "Bearer " + AUTH.session.access_token;
  }
  const res = await fetch(SUPA.url + path, {
    method: opts.method || "GET",
    headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401 && !opts.dejaRafraichi) {
    const ok = await refreshSession();
    if (ok) return supaFetch(path, Object.assign({}, opts, { dejaRafraichi: true }));
  }
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).message || ""; } catch (e) { /* corps vide */ }
    throw { code: res.status, message: detail || res.statusText };
  }
  if (res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

/* ---------- session ---------- */
function sessionFromResponse(d) {
  if (!d || !d.access_token) return null;
  return {
    access_token: d.access_token,
    refresh_token: d.refresh_token || null,
    expires_at: Date.now() + (Number(d.expires_in || 3600) * 1000)
  };
}
async function refreshSession() {
  const s = AUTH.session;
  if (!s || !s.refresh_token) return false;
  try {
    const d = await supaFetch("/auth/v1/token?grant_type=refresh_token", {
      method: "POST", anon: true, body: { refresh_token: s.refresh_token }
    });
    const ns = sessionFromResponse(d);
    if (!ns) return false;
    saveSession(ns);
    return true;
  } catch (e) { saveSession(null); return false; }
}

/* récupère les jetons renvoyés par Google dans le fragment d'URL */
function captureRedirect() {
  const h = location.hash || "";
  if (h.indexOf("access_token=") < 0 && h.indexOf("error=") < 0) return false;
  const p = new URLSearchParams(h.replace(/^#/, ""));
  if (p.get("error")) {
    AUTH.erreur = p.get("error_description") || p.get("error");
  } else {
    const s = sessionFromResponse({
      access_token: p.get("access_token"),
      refresh_token: p.get("refresh_token"),
      expires_in: p.get("expires_in")
    });
    if (s) saveSession(s);
  }
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; }
  return true;
}

function signInGoogle() {
  const back = location.origin + location.pathname;
  location.href = SUPA.url + "/auth/v1/authorize?provider=google&redirect_to=" + encodeURIComponent(back);
}
async function signOut() {
  try { await supaFetch("/auth/v1/logout", { method: "POST" }); } catch (e) { /* sans importance */ }
  saveSession(null);
  AUTH.user = null; AUTH.statut = null;
  try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
  location.reload();
}

function estAdmin() {
  return !!(AUTH.user && AUTH.user.email &&
    AUTH.user.email.toLowerCase() === SUPA.admin.toLowerCase());
}

/* ---------- vérification de l'accès ---------- */
async function verifierAcces() {
  const pay = jwtPayload(AUTH.session && AUTH.session.access_token);
  if (!pay || !pay.sub) { saveSession(null); return; }
  AUTH.user = {
    id: pay.sub,
    email: pay.email || "",
    nom: (pay.user_metadata && (pay.user_metadata.full_name || pay.user_metadata.name)) || ""
  };

  /* le déclencheur côté base crée la demande ; on la lit, et on la crée
     nous-mêmes si le déclencheur n'a pas encore tourné */
  let lignes = null;
  try {
    lignes = await supaFetch("/rest/v1/acces?select=statut&user_id=eq." + encodeURIComponent(AUTH.user.id));
  } catch (e) {
    AUTH.erreur = e.message || "lecture impossible";
    return;
  }
  if (Array.isArray(lignes) && lignes.length) {
    AUTH.statut = lignes[0].statut;
    return;
  }
  try {
    await supaFetch("/rest/v1/acces", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: [{ user_id: AUTH.user.id, email: AUTH.user.email, nom: AUTH.user.nom || null }]
    });
    AUTH.statut = estAdmin() ? "approuve" : "en_attente";
  } catch (e) {
    AUTH.statut = estAdmin() ? "approuve" : "en_attente";
  }
}

/* ---------- Supabase comme magasin de données ----------
   Quand l'authentification est active et l'accès approuvé, les recettes
   viennent de Postgres et non du fichier. C'est ce qui rend la protection
   réelle : la page ne contient plus rien à lire. */
function supaOn() {
  return !!(AUTH.actif && AUTH.statut === "approuve" && AUTH.user && AUTH.user.id);
}

async function supaLoad() {
  const rows = await supaFetch("/rest/v1/recettes?select=id,data");
  if (Array.isArray(rows)) {
    const liste = rows.map(function (r) { return r.data; })
                      .filter(function (x) { return x && x.id; });
    if (liste.length) S.recipes = liste;
  }
  let cat = null;
  try { cat = await supaFetch("/rest/v1/catalogue?select=cle,data"); } catch (e) { cat = null; }
  (cat || []).forEach(function (c) {
    if (c.cle !== "ingredients") return;
    const items = Array.isArray(c.data) ? c.data
                : (c.data && Array.isArray(c.data.items) ? c.data.items : null);
    if (items && items.length) S.ings = items;
  });
  try {
    const pr = await supaFetch("/rest/v1/prefs?select=data&user_id=eq." + encodeURIComponent(AUTH.user.id));
    if (Array.isArray(pr) && pr.length && pr[0].data) {
      if (pr[0].data.stock) S.stock = pr[0].data.stock;
      if (pr[0].data.shop) S.shop = pr[0].data.shop;
    }
  } catch (e) { /* premières visites : aucune préférence enregistrée */ }
  mergeIngs();
  _idx.clear();
  saveLocal();
}

function supaSaveRecipe(r) {
  return supaFetch("/rest/v1/recettes", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: [{ id: r.id, data: r, modifie_le: new Date().toISOString() }]
  });
}
function supaDeleteRecipe(id) {
  return supaFetch("/rest/v1/recettes?id=eq." + encodeURIComponent(id), {
    method: "DELETE", headers: { "Prefer": "return=minimal" }
  });
}
function supaSaveIngs() {
  return supaFetch("/rest/v1/catalogue", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: [{ cle: "ingredients", data: S.ings, modifie_le: new Date().toISOString() }]
  });
}
function supaSavePrefs() {
  return supaFetch("/rest/v1/prefs", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: [{ user_id: AUTH.user.id, data: { stock: S.stock, shop: S.shop }, modifie_le: new Date().toISOString() }]
  });
}

/* ---------- administration des demandes ---------- */
async function listerDemandes() {
  return await supaFetch("/rest/v1/acces?select=user_id,email,nom,statut,demande_le&order=demande_le.desc");
}
async function trancherDemande(userId, statut) {
  await supaFetch("/rest/v1/acces?user_id=eq." + encodeURIComponent(userId), {
    method: "PATCH",
    headers: { "Prefer": "return=minimal" },
    body: { statut: statut, decide_le: new Date().toISOString(), decide_par: AUTH.user.email }
  });
}
</script>

<script>
"use strict";

/* =====================================================================
   Interactions et demarrage
   ===================================================================== */

function setField(path, val) {
  const parts = path.split(".");
  if (parts[0] === "stock") {
    const id = parts[1];
    if (!S.stock[id]) S.stock[id] = { q: 0, u: "g" };
    S.stock[id].q = Number(val) || 0;
    saveLocal(); pushStock();
    return;
  }
  const d = S.draft;
  if (!d) return;
  let o = d;
  for (let i = 0; i < parts.length - 1; i++) {
    const kk = parts[i];
    o = Array.isArray(o) ? o[Number(kk)] : o[kk];
    if (!o) return;
  }
  const last = parts[parts.length - 1];
  const numeric = ["portions", "prep", "cook", "rest", "freeze", "q", "yieldQ"];
  o[last] = numeric.indexOf(last) >= 0 ? (Number(val) || 0) : val;
}

function openRecipe(id) {
  S.recipeId = id;
  S.portions = null;
  S.diet = null;
  S.screen = "recipe";
  render();
  window.scrollTo(0, 0);
}
function startEdit(r) {
  S.draft = r ? JSON.parse(JSON.stringify(r)) : emptyRecipe();
  if (!S.draft.sub) S.draft.sub = T("", "", "");
  if (!S.draft.notes) S.draft.notes = T("", "", "");
  if (!S.draft.tips) S.draft.tips = T("", "", "");
  S.draftLang = S.lang;
  S.screen = "edit";
  render();
  window.scrollTo(0, 0);
}
function saveDraft() {
  const d = S.draft;
  if (!d) return;
  if (!(d.n.ar || "").trim() && !(d.n.fr || "").trim() && !(d.n.en || "").trim()) {
    toast(t("name_required")); return;
  }
  d.ings = d.ings.filter(function (x) { return x && x.i; });
  d.steps = d.steps.filter(function (x) { return (x.ar || "").trim() || (x.fr || "").trim() || (x.en || "").trim(); });
  d.modified = today();
  if (!d.created) d.created = today();
  const i = S.recipes.findIndex(function (r) { return r.id === d.id; });
  if (i >= 0) S.recipes[i] = d; else S.recipes.push(d);
  _idx.delete(d.id);
  saveLocal();
  pushRecipe(d);
  const ph = S.photos[d.id];
  if (ph) { cachePhoto(d.id, ph); dbWrite("photos/" + d.id, { d: ph }); }
  const id = d.id;
  S.draft = null;
  toast(t("saved"));
  openRecipe(id);
}
function duplicateRecipe(r) {
  const c = JSON.parse(JSON.stringify(r));
  c.id = uid("RCP");
  LANGS.forEach(function (l) { if (c.n[l]) c.n[l] = c.n[l] + " " + t("copy_suffix", l); });
  c.created = today(); c.modified = today(); c.fav = false;
  S.recipes.push(c);
  saveLocal(); pushRecipe(c);
  const ph = readCachedPhoto(r.id);
  if (ph) { cachePhoto(c.id, ph); dbWrite("photos/" + c.id, { d: ph }); }
  toast(t("duplicated"));
  openRecipe(c.id);
}
function deleteRecipe(id) {
  S.recipes = S.recipes.filter(function (r) { return r.id !== id; });
  delete S.shop[id];
  _idx.delete(id);
  dropPhoto(id);
  saveLocal(); pushShop();
  if (supaOn()) supaDeleteRecipe(id).catch(function () { toast(t("err_save")); });
  else if (S.db) S.db.doc("recipes/" + id).delete().catch(function () {});
  toast(t("deleted"));
  S.screen = "list"; S.recipeId = null;
  render();
}
function pickPhoto() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = async function () {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f || !S.draft) return;
    try {
      const img = await readImage(f);
      S.draft.thumb = toJpeg(img, 320, THUMB_MAX_BYTES, true);
      S.photos[S.draft.id] = toJpeg(img, 1400, PHOTO_MAX_BYTES, false);
      render();
    } catch (e) { toast(t("err_photo")); }
  };
  inp.click();
}
function addToShop(id) {
  const r = recipeById(id);
  if (!r) return;
  S.shop[id] = S.portions && S.recipeId === id ? S.portions : (r.portions || 1);
  saveLocal(); pushShop();
  toast(t("in_shop"));
  render();
}

/* ---------- delegation des evenements ---------- */
document.addEventListener("click", function (ev) {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  const v = el.getAttribute("data-v");
  const sh = S.sheet;

  if (act === "query" || act === "sheetq") return;
  if (act === "sheetbg" && ev.target !== el) return;

  switch (act) {
    case "lang": S.lang = v; saveLocal(); render(); break;
    case "plang": S.printLang = v; render(); break;
    case "nav":
      S.screen = v;
      if (v === "list" || v === "ings") S.query = "";
      if (v === "admin") {
        S.demandes = null;
        listerDemandes().then(function (d) { S.demandes = d || []; render(); })
                        .catch(function () { S.demandes = []; toast(t("a_error")); render(); });
      }
      render(); window.scrollTo(0, 0); break;
    case "cat":
      S.filter.cat = v || ""; S.query = ""; S.screen = "list";
      render(); window.scrollTo(0, 0); break;
    case "open": openRecipe(v); break;
    case "clearq": S.query = ""; render(); break;
    case "clearf": S.filter = { cat: "", diff: "", maxTime: "", minPort: "", diet: "" }; render(); break;

    case "pminus": S.portions = Math.max(1, (S.portions || recipeById(S.recipeId).portions) - 1); render(); break;
    case "pplus": S.portions = (S.portions || recipeById(S.recipeId).portions) + 1; render(); break;
    case "pset": S.portions = Number(v); render(); break;
    case "diet": S.diet = v || null; render(); window.scrollTo(0, 0); break;
    case "signin": signInGoogle(); break;
    case "signout": signOut(); break;
    case "approve": case "refuse": {
      const st = act === "approve" ? "approuve" : "refuse";
      trancherDemande(v, st).then(function () {
        return listerDemandes();
      }).then(function (d) {
        S.demandes = d || [];
        toast(st === "approuve" ? t("a_st_ok") : t("a_st_no"));
        render();
      }).catch(function () { toast(t("a_error")); });
      break;
    }
    case "fdiet": break;
    case "chk":
      S.checked[v] = !S.checked[v];
      el.setAttribute("data-done", S.checked[v] ? "1" : "0");
      break;

    case "new": startEdit(null); break;
    case "editr": startEdit(recipeById(v)); break;
    case "dupr": duplicateRecipe(recipeById(v)); break;
    case "delr": {
      const r = recipeById(v);
      S.sheet = { type: "confirm", title: t("confirm_del"), body: L(r.n) + " — " + t("del_warn"), ok: t("del"), onYes: function () { deleteRecipe(v); } };
      syncSheet(); break;
    }
    case "printr": printRecipe(v); break;
    case "toshop": addToShop(v); break;
    case "canceledit": S.draft = null; S.screen = S.recipeId ? "recipe" : "list"; render(); break;
    case "saver": saveDraft(); break;
    case "dlang": S.draftLang = v; render(); break;
    case "addingrow": S.draft.ings.push(ing("", 100, "g", "pate")); render(); break;
    case "delingrow": S.draft.ings.splice(Number(v), 1); render(); break;
    case "pickings": S.sheet = { type: "ingpick", row: Number(v), q: "" }; syncSheet(); break;
    case "addstep": S.draft.steps.push(T("", "", "")); render(); break;
    case "delstep": S.draft.steps.splice(Number(v), 1); render(); break;
    case "stepup": {
      const i = Number(v);
      if (i > 0) { const a = S.draft.steps; const tmp = a[i - 1]; a[i - 1] = a[i]; a[i] = tmp; render(); }
      break;
    }
    case "pickphoto": pickPhoto(); break;
    case "rmphoto":
      S.draft.thumb = null; delete S.photos[S.draft.id];
      if (recipeById(S.draft.id)) dropPhoto(S.draft.id);
      render(); break;

    case "newing":
      S.sheet = { type: "ingform", ing: { id: "", ar: "", fr: "", en: "", cat: "i11", unit: "g", dens: 0 }, back: sh }; 
      syncSheet(); break;
    case "editing": {
      const g = ingById(v);
      S.sheet = { type: "ingform", ing: JSON.parse(JSON.stringify(g)) };
      syncSheet(); break;
    }
    case "saveing": {
      const g = S.sheet.ing;
      if (!(g.fr || "").trim() && !(g.ar || "").trim() && !(g.en || "").trim()) { toast(t("name_required")); break; }
      g.dens = Number(g.dens) || 0;
      if (g.id) {
        const i = S.ings.findIndex(function (x) { return x.id === g.id; });
        if (i >= 0) S.ings[i] = g;
      } else {
        g.id = uid("ing").toLowerCase();
        S.ings.push(g);
      }
      _idx.clear();
      saveLocal(); pushIngs();
      const back = S.sheet.back;
      S.sheet = back || null;
      if (back && back.type === "ingpick" && S.draft && S.draft.ings[back.row]) S.draft.ings[back.row].i = g.id;
      if (back && back.type === "stockpick") { S.stock[g.id] = { q: 1, u: g.unit }; pushStock(); S.sheet = null; }
      toast(t("saved"));
      render(); break;
    }

    case "sheetpick": {
      if (sh.type === "ingpick" && S.draft) {
        const it = S.draft.ings[sh.row];
        const g = ingById(v);
        if (it) { it.i = v; if (g && g.unit) it.u = g.unit; }
      } else if (sh.type === "stockpick") {
        const g = ingById(v);
        if (!S.stock[v]) S.stock[v] = { q: 1, u: g ? g.unit : "g" };
        saveLocal(); pushStock();
      }
      S.sheet = null; render(); break;
    }
    case "sheetrecipe": {
      const r = recipeById(v);
      if (r) {
        if (Object.prototype.hasOwnProperty.call(S.shop, v)) delete S.shop[v];
        else S.shop[v] = r.portions || 1;
        saveLocal(); pushShop();
      }
      syncSheet(); render(); break;
    }
    case "sheetclose": case "sheetbg": S.sheet = null; syncSheet(); break;
    case "confirmyes": { const f = S.sheet.onYes; S.sheet = null; syncSheet(); if (f) f(); break; }

    case "shoppick": S.sheet = { type: "recipepick", q: "" }; syncSheet(); break;
    case "stockpick": S.sheet = { type: "stockpick", q: "" }; syncSheet(); break;
    case "unshop": delete S.shop[v]; saveLocal(); pushShop(); render(); break;
    case "sminus": S.shop[v] = Math.max(1, (S.shop[v] || 1) - 1); saveLocal(); pushShop(); render(); break;
    case "splus": S.shop[v] = (S.shop[v] || 1) + 1; saveLocal(); pushShop(); render(); break;
    case "clearshop":
      S.sheet = { type: "confirm", title: t("shop_clear"), body: "", ok: t("shop_clear"), onYes: function () { S.shop = {}; saveLocal(); pushShop(); render(); } };
      syncSheet(); break;
    case "printshop": printShopping(); break;
    case "csvshop": exportShopCsv(); break;
    case "delstock": delete S.stock[v]; saveLocal(); pushStock(); render(); break;

    case "csvrec": exportRecipesCsv(); break;
    case "csvsteps": exportStepsCsv(); break;
    case "csving": exportIngCsv(); break;
    case "jsonout": exportJson(); break;
    case "jsonin": {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = "application/json,.json";
      inp.onchange = function () {
        const f = inp.files && inp.files[0];
        if (f) {
          S.sheet = { type: "confirm", title: t("import_json"), body: t("import_warn"), ok: t("import_json"), onYes: function () { importJson(f); } };
          syncSheet();
        }
        inp.remove();
      };
      inp.style.display = "none"; document.body.appendChild(inp); inp.click();
      break;
    }
    case "reseed":
      S.sheet = { type: "confirm", title: t("reseed"), body: t("import_warn"), ok: t("reseed"), onYes: async function () {
        await seedAll(); S.shop = {}; S.stock = {}; _idx.clear();
        saveLocal(); pushShop(); pushStock();
        S.screen = "home"; render(); toast(t("import_done"));
      } };
      syncSheet(); break;
  }
});

document.addEventListener("change", function (ev) {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  const v = el.getAttribute("data-v");
  const val = el.value;
  switch (act) {
    case "fdiff": S.filter.diff = val; render(); break;
    case "ftime": S.filter.maxTime = val; render(); break;
    case "fport": S.filter.minPort = val; render(); break;
    case "fsort": S.sort = val; render(); break;
    case "fdietf": S.filter.diet = val; render(); break;
    case "fcat": S.draft.cat = val; render(); break;
    case "fdiffe": S.draft.diff = Number(val); break;
    case "fyu": S.draft.yieldU = val; break;
    case "iu": S.draft.ings[Number(v)].u = val; break;
    case "ig": S.draft.ings[Number(v)].g = val; render(); break;
    case "im": S.draft.ings[Number(v)].m = val; break;
    case "su": S.stock[v].u = val; saveLocal(); pushStock(); break;
  }
});

let queryTimer = null;
document.addEventListener("input", function (ev) {
  const el = ev.target;
  const f = el.getAttribute("data-f");
  if (f) { setField(f, el.value); return; }
  const g = el.getAttribute("data-g");
  if (g && S.sheet && S.sheet.ing) { S.sheet.ing[g] = el.value; return; }
  const act = el.getAttribute("data-act");
  if (act === "query") {
    S.query = el.value;
    clearTimeout(queryTimer);
    queryTimer = setTimeout(function () {
      const pos = el.selectionStart;
      render();
      const nx = document.querySelector('[data-act="query"]');
      if (nx) { nx.focus(); try { nx.setSelectionRange(pos, pos); } catch (e) {} }
    }, 180);
  } else if (act === "sheetq" && S.sheet) {
    S.sheet.q = el.value;
    syncSheet();
  }
});

document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && S.sheet) { S.sheet = null; syncSheet(); }
});

/* ---------- demarrage ---------- */
function boot() {
  const had = loadLocal();
  if (!S.ings.length) S.ings = ING_SEED.concat(ING_SUBS_SEED, ING_SALE_SEED);
  if (!had) {
    S.recipes = allSeed();
    mergeIngs();
    saveLocal();
    setLocalSeedVersion(SEED_VERSION);
  } else if (localSeedVersion() < SEED_VERSION) {
    const have = {};
    S.recipes.forEach(function (r) { have[r.id] = 1; });
    allSeed().forEach(function (r) { if (!have[r.id]) S.recipes.push(r); });
    mergeIngs();
    _idx.clear();
    saveLocal();
    setLocalSeedVersion(SEED_VERSION);
  }
  if (!S.printLang) S.printLang = S.lang;
  S.booted = true;
  render();
  bootAuth().then(function () {
    render();
    if (!AUTH.actif) { connectDb(); return; }
    if (!supaOn()) return;
    supaLoad().then(function () { render(); })
              .catch(function (e) {
                AUTH.erreur = (e && e.message) || t("a_error");
                toast(t("a_error"));
              });
  });
}

async function bootAuth() {
  AUTH.actif = !!(SUPA.url && SUPA.key);
  if (!AUTH.actif) { AUTH.pret = true; return; }
  try {
    captureRedirect();
    AUTH.session = loadSession();
    if (AUTH.session) {
      if (AUTH.session.expires_at && AUTH.session.expires_at < Date.now() + 60000) {
        await refreshSession();
      }
      if (AUTH.session) await verifierAcces();
    }
  } catch (e) {
    AUTH.erreur = (e && e.message) || String(e);
  }
  AUTH.pret = true;
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>

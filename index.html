<meta charset="utf-8">
<title>Siham Délice de Fès</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=Amiri:wght@400;700&display=swap">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Siham Délice">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBF6F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171113" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
:root{
  --ground:#FBF6F5; --surface:#FFFCFB; --surface-2:#F4E9E8; --surface-3:#EBDBDA;
  --ink:#241A1C; --ink-soft:#5E4A4E; --ink-faint:#8C7579;
  --line:#E4D3D3; --line-soft:#EFE2E1;
  --accent:#9B3A61; --accent-2:#B8566F; --accent-wash:#F8E7EC; --on-accent:#FFFCFB;
  --gold:#A8813C; --gold-wash:#F5EBDB;
  --brown:#7A4A55;
  --ok:#2F6B52; --warn:#8F6520; --danger:#B4462B; --danger-wash:#F9E9E2;
  --shadow-1:0 1px 2px rgba(34,31,25,.06);
  --shadow-2:0 2px 6px rgba(34,31,25,.07),0 12px 28px -18px rgba(34,31,25,.3);
  --r:10px; --r-s:7px;
  --tap:46px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#171113; --surface:#201819; --surface-2:#291F21; --surface-3:#33272A;
    --ink:#F0E4E7; --ink-soft:#B3A0A5; --ink-faint:#857073;
    --line:#382B2E; --line-soft:#2E2325;
    --accent:#E794AE; --accent-2:#F0A9BF; --accent-wash:#2C1C22; --on-accent:#24121A;
    --gold:#D2A857; --gold-wash:#2C2419;
    --brown:#C09B8B;
    --ok:#77C39B; --warn:#D2A857; --danger:#E68A6B; --danger-wash:#33201A;
    --shadow-1:0 1px 2px rgba(0,0,0,.45);
    --shadow-2:0 2px 6px rgba(0,0,0,.5),0 12px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#171113; --surface:#201819; --surface-2:#291F21; --surface-3:#33272A;
  --ink:#F0E4E7; --ink-soft:#B3A0A5; --ink-faint:#857073;
  --line:#382B2E; --line-soft:#2E2325;
  --accent:#E794AE; --accent-2:#F0A9BF; --accent-wash:#2C1C22; --on-accent:#24121A;
  --gold:#D2A857; --gold-wash:#2C2419;
  --brown:#C09B8B;
  --ok:#77C39B; --warn:#D2A857; --danger:#E68A6B; --danger-wash:#33201A;
  --shadow-1:0 1px 2px rgba(0,0,0,.45);
  --shadow-2:0 2px 6px rgba(0,0,0,.5),0 12px 28px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-wrap:break-word;
}
[dir="rtl"] body,[dir="rtl"] input,[dir="rtl"] textarea,[dir="rtl"] select,[dir="rtl"] button{
  font-family:Amiri,"IBM Plex Sans",serif;font-size:17.5px;line-height:1.72;
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25;text-wrap:balance}
.serif{font-family:Marcellus,Georgia,serif;font-weight:400}
[dir="rtl"] .serif{font-family:Amiri,serif;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;unicode-bidi:isolate}

/* ============ shell ============ */
#app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--ground);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:12px
}
.brand{font-family:Marcellus,Georgia,serif;font-size:17.5px;letter-spacing:.01em;line-height:1.15}
.brand b{font-weight:400;display:inline}
.brand span{color:var(--gold);font-size:.76em;letter-spacing:.03em;display:inline}
[dir="rtl"] .brand{font-family:Amiri,serif;font-weight:700}
.spacer{flex:1}
.langsw{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.langsw button{
  min-width:40px;height:32px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:500;
  color:var(--ink-soft);transition:background .14s,color .14s
}
.langsw button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-1)}
.langsw button:nth-child(1){font-family:Amiri,serif;font-size:16px}

main{flex:1;padding:0 0 calc(env(safe-area-inset-bottom) + 84px)}
.pad{padding:18px 16px 8px}
.wrap{max-width:760px;margin:0 auto;width:100%}

.tabbar{
  position:fixed;inset-inline:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);
  display:grid;grid-template-columns:repeat(5,1fr)
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  color:var(--ink-faint);border-radius:var(--r-s);min-height:var(--tap)
}
.tabbar button .ico{font-size:19px;line-height:1}
.tabbar button .lb{font-size:10.5px;font-weight:500;letter-spacing:.01em}
[dir="rtl"] .tabbar button .lb{font-size:12px}
.tabbar button[aria-current="page"]{color:var(--accent)}

@media (min-width:900px){
  #app{flex-direction:row}
  .topbar{
    position:fixed;inset-inline-start:0;top:0;bottom:0;width:232px;
    flex-direction:column;align-items:stretch;gap:0;
    border-bottom:0;border-inline-end:1px solid var(--line);
    padding:26px 18px calc(env(safe-area-inset-bottom) + 18px)
  }
  .topbar .brand{font-size:21px;margin-bottom:22px;white-space:normal}
  .topbar .spacer{display:none}
  .topbar .langsw{order:3;margin-top:auto}
  main{margin-inline-start:232px;padding-bottom:40px;width:100%}
  .tabbar{
    position:fixed;inset-inline-start:0;inset-inline-end:auto;top:96px;bottom:auto;width:232px;
    background:none;backdrop-filter:none;border-top:0;
    display:flex;flex-direction:column;gap:2px;padding:0 12px
  }
  .tabbar button{
    flex-direction:row;justify-content:flex-start;gap:11px;padding:9px 12px;font-size:14.5px
  }
  .tabbar button .lb{font-size:14.5px}
  .tabbar button[aria-current="page"]{background:var(--accent-wash)}
}

/* ============ atoms ============ */
.h-screen{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:27px;margin-bottom:4px}
[dir="rtl"] .h-screen{font-family:Amiri,serif;font-weight:700;font-size:29px}
.sub{color:var(--ink-soft);font-size:14px;margin-bottom:16px}
.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);margin:26px 0 10px
}
[dir="rtl"] .eyebrow{letter-spacing:0;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);padding:0 18px;border-radius:var(--r-s);
  font-size:15px;font-weight:500;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line);transition:filter .12s
}
.btn:active{filter:brightness(.94)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:none;border-color:var(--line)}
.btn.danger{background:var(--danger-wash);color:var(--danger);border-color:transparent}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);
  white-space:nowrap
}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.badge{
  display:inline-block;padding:2px 8px;border-radius:5px;font-size:11.5px;font-weight:500;
  background:var(--gold-wash);color:var(--gold)
}
[dir="rtl"] .badge{font-size:13px}
.hr{height:1px;background:var(--line);margin:20px 0}
.muted{color:var(--ink-faint)}
.empty{text-align:center;padding:48px 20px;color:var(--ink-faint)}
.empty .big{font-size:38px;margin-bottom:12px;opacity:.5}

/* fields */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
[dir="rtl"] .field label{font-size:14px}
.input,.select,.textarea{
  width:100%;min-height:var(--tap);padding:11px 13px;border-radius:var(--r-s);
  background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:16px
}
.textarea{min-height:88px;resize:vertical;line-height:1.55}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-end:38px}
[dir="rtl"] .select{background-position:18px 50%,23px 50%;background-image:linear-gradient(-45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(-135deg,var(--ink-faint) 50%,transparent 50%);padding-inline-end:13px;padding-inline-start:38px}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* search */
.searchbox{position:relative;margin-bottom:14px}
.searchbox input{
  width:100%;height:50px;padding-inline:44px 40px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:16px;box-shadow:var(--shadow-1)
}
.searchbox .mag{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);opacity:.5;font-size:16px;pointer-events:none}
.searchbox .clr{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;color:var(--ink-faint);font-size:17px}

/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:15px 14px;min-height:92px;border-radius:var(--r);text-align:start;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)
}
.tile .ico{font-size:23px;line-height:1}
.tile .nm{font-size:14px;font-weight:500;line-height:1.3}
.tile .ct{font-size:12px;color:var(--ink-faint)}
[dir="rtl"] .tile .nm{font-size:16px}

/* recipe list */
.rlist{display:flex;flex-direction:column;gap:9px}
.ritem{
  display:flex;gap:13px;align-items:center;padding:10px;border-radius:var(--r);text-align:start;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);width:100%
}
.ritem .thumb{
  width:66px;height:66px;flex:0 0 66px;border-radius:var(--r-s);overflow:hidden;
  background:var(--surface-3);display:grid;place-items:center;font-size:25px
}
.ritem .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ritem .body{flex:1;min-width:0}
.ritem .nm{font-weight:600;font-size:15.5px;line-height:1.28;margin-bottom:3px}
[dir="rtl"] .ritem .nm{font-size:17px}
.ritem .mt{font-size:12.5px;color:var(--ink-faint);display:flex;gap:9px;flex-wrap:wrap}
[dir="rtl"] .ritem .mt{font-size:14px}
.dots{display:inline-flex;gap:2.5px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--gold)}

/* recipe detail */
.hero{
  position:relative;width:100%;aspect-ratio:4/3;max-height:340px;background:var(--surface-3);
  display:grid;place-items:center;font-size:60px;overflow:hidden
}
.hero .ph{width:100%;height:100%;display:block}
.illus{display:block;width:100%;height:100%}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.detail-head{padding:18px 16px 4px}
.detail-title{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:30px;line-height:1.14;margin-bottom:8px}
[dir="rtl"] .detail-title{font-family:Amiri,serif;font-weight:700;font-size:32px;line-height:1.35}
.facts{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:16px 0}
.fact{background:var(--surface);padding:11px 8px;text-align:center;flex:1 1 78px}
.fact .v{font-size:16px;font-weight:600;line-height:1.2}
.fact .k{font-size:10.5px;color:var(--ink-faint);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
[dir="rtl"] .fact .k{font-size:12px;letter-spacing:0;text-transform:none}

.portions{
  position:sticky;top:calc(env(safe-area-inset-top) + 53px);z-index:30;
  background:color-mix(in srgb,var(--ground) 94%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-block:1px solid var(--line);padding:11px 16px;margin-bottom:4px
}
@media (min-width:900px){.portions{top:0}}
.portions .line{display:flex;align-items:center;gap:12px}
.portions .lbl{font-size:13px;color:var(--ink-soft);flex:1;min-width:0}
[dir="rtl"] .portions .lbl{font-size:15px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px}
.stepper button{width:36px;height:36px;border-radius:50%;font-size:19px;font-weight:500;color:var(--accent);display:grid;place-items:center}
.stepper .val{min-width:44px;text-align:center;font-size:16px;font-weight:600}
.quick{display:flex;gap:6px;margin-top:9px}
.quick button{
  flex:1;height:32px;border-radius:var(--r-s);background:var(--surface-2);border:1px solid var(--line);
  font-size:13px;font-weight:500;color:var(--ink-soft)
}
.quick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.grp-title{font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px}
[dir="rtl"] .grp-title{font-size:15px;letter-spacing:0;text-transform:none}
.ing{
  display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border-radius:var(--r-s);
  background:var(--surface);border:1px solid var(--line-soft);margin-bottom:6px;width:100%;text-align:start
}
.ing .box{
  width:21px;height:21px;flex:0 0 21px;border-radius:5px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:12px;color:var(--on-accent);margin-top:2px
}
.ing[data-done="1"] .box{background:var(--accent);border-color:var(--accent)}
.ing[data-done="1"] .nm{text-decoration:line-through;color:var(--ink-faint)}
.ing .nm{flex:1;font-size:15px;line-height:1.4}
[dir="rtl"] .ing .nm{font-size:16.5px}
.ing .nm em{font-style:normal;color:var(--ink-faint);font-size:13px}
.ing .qt{font-weight:600;font-size:15px;white-space:nowrap;color:var(--accent)}
.ing .qt.manual{color:var(--gold)}

.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);width:100%;text-align:start}
.step:last-child{border-bottom:0}
.step .n{
  width:27px;height:27px;flex:0 0 27px;border-radius:50%;background:var(--surface-2);
  display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--gold);margin-top:1px
}
.step[data-done="1"] .n{background:var(--accent);color:var(--on-accent)}
.step[data-done="1"] .tx{color:var(--ink-faint)}
.step .tx{flex:1;font-size:15px;line-height:1.55}
[dir="rtl"] .step .tx{font-size:16.5px}
.gate{min-height:100dvh;display:grid;place-items:center;padding:36px 20px;background:var(--ground)}
.gatecard{width:100%;max-width:420px;text-align:center}
.gatecard .brand{font-size:26px;justify-content:center;margin-bottom:6px}
.gatecard h2{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:24px;margin:22px 0 10px}
[dir="rtl"] .gatecard h2{font-family:Amiri,serif;font-weight:700}
.gatecard p{font-size:14.5px;color:var(--ink-soft);margin:0 auto 20px;max-width:34ch}
.gatecard .mark{font-size:44px;line-height:1;margin-bottom:4px}
.gatecard .who{font-size:13px;color:var(--ink-faint);margin-top:16px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;
  padding:0 24px;border-radius:999px;background:var(--accent);color:var(--on-accent);
  font-size:15.5px;font-weight:500;box-shadow:var(--shadow-2)}
.reqrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 13px;border-bottom:1px solid var(--line-soft)}
.reqrow:last-child{border-bottom:0}
.reqrow .who{flex:1 1 100%;order:1;min-width:0;font-size:14.5px;line-height:1.3;text-align:start;
  overflow-wrap:anywhere}
.reqrow .who em{font-style:normal;display:block;color:var(--ink-faint);font-size:12.5px}
[dir="rtl"] .reqrow .who{font-size:16px}
.reqrow .dv{order:2}
.reqrow .acts{order:3;display:flex;gap:6px;flex-shrink:0;margin-inline-start:auto}
.dietbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 2px}
.dietrow{display:flex;align-items:center;gap:11px;width:100%;text-align:start;padding:10px 13px;border-bottom:1px solid var(--line-soft)}
.dietrow:last-child{border-bottom:0}
.dietrow .di{flex:0 0 22px;font-size:15px;text-align:center}
.dietrow .dn{flex:1;font-size:14.5px;line-height:1.35;min-width:0}
.dietrow .dn em{font-style:normal;color:var(--ink-faint);font-size:12.5px;display:block}
[dir="rtl"] .dietrow .dn{font-size:16px}
[dir="rtl"] .dietrow .dn em{font-size:14px}
.dv{flex:0 0 auto;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:4px;white-space:nowrap}
[dir="rtl"] .dv{font-size:13px}
.dv.ok{background:var(--accent-wash);color:var(--ok)}
.dv.adapt{background:var(--gold-wash);color:var(--warn)}
.dv.no{background:var(--danger-wash);color:var(--danger)}
button.dietrow:active{background:var(--surface-2)}
.tipbox{background:var(--gold-wash);border-inline-start:2px solid var(--gold);border-radius:0 var(--r-s) var(--r-s) 0;padding:13px 15px;margin:12px 0;font-size:14.5px;line-height:1.55}
[dir="rtl"] .tipbox{border-radius:var(--r-s) 0 0 var(--r-s);font-size:16px}

.actbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:22px 0 10px}

/* shopping */
.sl-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line-soft);width:100%;text-align:start}
.sl-item:last-child{border-bottom:0}
.sl-item .nm{flex:1;font-size:15px}
[dir="rtl"] .sl-item .nm{font-size:16.5px}
.sl-item .qt{font-weight:600;white-space:nowrap;font-size:15px}
.sl-item[data-done="1"] .nm,.sl-item[data-done="1"] .qt{text-decoration:line-through;color:var(--ink-faint)}
.stockflag{font-size:11.5px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.stockflag.ok{background:var(--accent-wash);color:var(--ok)}
.stockflag.no{background:var(--danger-wash);color:var(--danger)}
[dir="rtl"] .stockflag{font-size:13px}

/* modal / sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,19,14,.5);z-index:60;display:grid;place-items:end center}
.sheet{
  width:100%;max-width:640px;max-height:88dvh;overflow-y:auto;background:var(--ground);
  border-radius:16px 16px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);
  box-shadow:var(--shadow-2)
}
@media (min-width:700px){.sheet-bg{place-items:center}.sheet{border-radius:16px;max-height:82dvh}}
.sheet h3{font-size:19px;margin-bottom:14px}
.sheet-close{position:sticky;top:0;float:inline-end;width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:17px;color:var(--ink-soft)}
.picklist{max-height:52dvh;overflow-y:auto;margin:-4px -4px 0;padding:4px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:11px 12px;border-radius:var(--r-s);border-bottom:1px solid var(--line-soft)}
.pick:hover{background:var(--surface-2)}
.pick .nm{flex:1;font-size:15px}
.pick .sec{font-size:12.5px;color:var(--ink-faint)}

/* editor rows */
.erow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:11px;margin-bottom:8px}
.erow .top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.erow .top .nm{flex:1;font-size:14.5px;font-weight:500}
.iconbtn{width:34px;height:34px;flex:0 0 34px;border-radius:var(--r-s);background:var(--surface-2);display:grid;place-items:center;font-size:15px;color:var(--ink-soft)}
.iconbtn.danger{color:var(--danger)}

.toast{
  position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:70;
  display:flex;justify-content:center;pointer-events:none;padding:0 16px
}
.toast div{
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;font-size:14px;
  box-shadow:var(--shadow-2);max-width:100%
}
@media (min-width:900px){.toast{bottom:24px;inset-inline-start:232px}}

/* ============ print ============ */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm 15mm}
  html,body{background:#fff!important;color:#000!important}
  #app,.toast,.sheet-bg{display:none!important}
  #print{display:block!important;font-family:"IBM Plex Sans",sans-serif;color:#000;font-size:10.5pt;line-height:1.45}
  #print[dir="rtl"]{font-family:Amiri,serif;font-size:12pt;line-height:1.8}

  #print h1{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:23pt;line-height:1.1;margin:0 0 3mm}
  #print[dir="rtl"] h1{font-family:Amiri,serif;font-weight:700;font-size:24pt;line-height:1.4}
  #print .p-img{width:100%;max-height:72mm;object-fit:cover;border-radius:2mm;margin:0 0 5mm;display:block}
  #print .p-illus{width:100%;height:46mm;overflow:hidden;border-radius:2mm;margin:0 0 5mm}
  #print .p-illus svg{width:100%;height:100%;display:block}
  #print .p-facts{display:flex;flex-wrap:wrap;gap:0;border:.5pt solid #bbb;border-radius:1.5mm;margin:0 0 6mm;overflow:hidden}
  #print .p-fact{flex:1 1 22%;padding:2.5mm 3mm;border-inline-end:.5pt solid #ddd;text-align:center}
  #print .p-fact:last-child{border-inline-end:0}
  #print .p-fact .v{font-size:11pt;font-weight:600}
  #print .p-fact .k{font-size:7.5pt;color:#666;text-transform:uppercase;letter-spacing:.06em}
  #print[dir="rtl"] .p-fact .k{font-size:9.5pt;text-transform:none;letter-spacing:0}
  #print h2{font-size:11pt;letter-spacing:.1em;text-transform:uppercase;color:#9B3A61;margin:0 0 3mm;padding-bottom:1.5mm;border-bottom:.5pt solid #ccc}
  #print[dir="rtl"] h2{font-size:13pt;letter-spacing:0;text-transform:none}
  #print .p-cols{display:grid;grid-template-columns:38% 1fr;gap:9mm;align-items:start}
  #print .p-grp{font-size:8.5pt;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#A8813C;margin:3mm 0 1.5mm}
  #print[dir="rtl"] .p-grp{font-size:10.5pt;text-transform:none;letter-spacing:0}
  #print .p-ing{display:flex;justify-content:space-between;gap:4mm;padding:1.1mm 0;border-bottom:.4pt dotted #ccc;break-inside:avoid}
  #print .p-ing .q{font-weight:600;white-space:nowrap}
  #print .p-step{display:flex;gap:3mm;padding:1.6mm 0;break-inside:avoid}
  #print .p-step .n{font-weight:600;color:#A8813C;min-width:5mm}
  #print .p-tip{border-inline-start:1.4pt solid #A8813C;background:#FAF0F2;padding:2.5mm 3.5mm;margin-top:4mm;font-size:9.5pt;break-inside:avoid}
  #print[dir="rtl"] .p-tip{font-size:11pt}
  #print .p-foot{margin-top:7mm;padding-top:2.5mm;border-top:.5pt solid #ccc;font-size:8pt;color:#666;display:flex;justify-content:space-between}
  #print .p-sl{width:100%;border-collapse:collapse}
  #print .p-sl td{padding:1.8mm 2mm;border-bottom:.4pt solid #ddd;font-size:10pt}
  #print .p-sl td.q{text-align:end;font-weight:600;white-space:nowrap}
  #print .p-sl td.b{width:6mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";

/* =====================================================================
   Etat, persistance et utilitaires
   ===================================================================== */

const LS_KEY = "darhlou.v1";
const PHOTO_MAX_BYTES = 170000;   // marge sous la limite de 256 Kio par document
const THUMB_MAX_BYTES = 14000;

const S = {
  lang: "fr",
  screen: "home",
  recipeId: null,
  portions: null,
  query: "",
  filter: { cat: "", diff: "", maxTime: "", minPort: "", diet: "" },
  sort: "name",
  diet: null,
  demandes: null,
  draft: null,
  ings: [],
  recipes: [],
  stock: {},
  shop: {},
  checked: {},
  photos: {},
  printLang: null,
  db: null,
  synced: false,
  booted: false
};

/* ---------- helpers ---------- */
const $ = function (sel, root) { return (root || document).querySelector(sel); };
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function L(o, lang) {
  if (!o) return "";
  const l = lang || S.lang;
  return o[l] || o.fr || o.en || o.ar || "";
}
function t(key, lang) { return L(UI[key], lang); }
function uid(p) {
  return p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function today() { return new Date().toISOString().slice(0, 10); }

function unitById(id) {
  for (let i = 0; i < UNITS.length; i++) if (UNITS[i].id === id) return UNITS[i];
  return UNITS[0];
}
function ingById(id) {
  for (let i = 0; i < S.ings.length; i++) if (S.ings[i].id === id) return S.ings[i];
  return null;
}
function catById(id) {
  for (let i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i];
  return null;
}
function recipeById(id) {
  for (let i = 0; i < S.recipes.length; i++) if (S.recipes[i].id === id) return S.recipes[i];
  return null;
}

function fmtNum(n) {
  if (!isFinite(n)) return "0";
  let s;
  if (Math.abs(n) >= 100) s = String(Math.round(n));
  else if (Math.abs(n) >= 10) s = (Math.round(n * 10) / 10).toString();
  else s = (Math.round(n * 100) / 100).toString();
  if (S.lang !== "en") s = s.replace(".", ",");
  return s;
}
function fmtTime(min, lang) {
  const l = lang || S.lang;
  if (!min) return "—";
  if (min < 60) return fmtNum(min) + " " + t("minutes", l);
  const h = Math.floor(min / 60), m = min % 60;
  return m ? h + " " + t("hours", l) + " " + m : h + " " + t("hours", l);
}

/* Pas d'arrondi adaptatif : un pas de 5 g convient a 500 g, jamais a 7 g.
   Le pas ne depasse jamais 5 % de la quantite, et se choisit sur une echelle lisible. */
const STEP_LADDER = [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 25, 50, 100];
function pickStep(v, u) {
  const floor = u.type === "unit" ? 0.25 : 0.05;
  const target = Math.min(u.step || 1, Math.max(Math.abs(v) * 0.05, floor));
  let s = floor;
  for (let i = 0; i < STEP_LADDER.length; i++) {
    if (STEP_LADDER[i] <= target + 1e-9 && STEP_LADDER[i] >= floor) s = STEP_LADDER[i];
  }
  return s;
}

/* mise a l'echelle : Lineaire / Fixe / Racine (colonne Mode_Echelle du modele) */
function scaledQty(item, k) {
  const raw = item.m === "fix" ? item.q
            : item.m === "root" ? item.q * Math.sqrt(k)
            : item.q * k;
  const u = unitById(item.u);
  if (!u.step) return raw;
  const s = pickStep(raw, u);
  return Math.round(Math.round(raw / s) * s * 10000) / 10000;
}
/* choisit l'unite la plus lisible : 1000 g -> 1 kg, 1500 ml -> 1,5 l */
function readable(q, unitId) {
  const u = unitById(unitId);
  if (u.type === "mass") {
    const g = q * u.factor;
    if (g >= 1000) return { q: g / 1000, u: "kg" };
    if (unitId === "kg") return { q: g, u: "g" };
  }
  if (u.type === "vol" && (unitId === "ml" || unitId === "l")) {
    const ml = q * u.factor;
    if (ml >= 1000) return { q: ml / 1000, u: "l" };
    if (unitId === "l") return { q: ml, u: "ml" };
  }
  return { q: q, u: unitId };
}
function qtyLabel(q, unitId, lang) {
  const l = lang || S.lang;
  const r = readable(q, unitId);
  const u = unitById(r.u);
  if (u.type === "misc" && r.u === "qs") return t("qs", l);
  return '<span class="num">' + esc(fmtNum(r.q)) + "</span> " + esc(L(u, l));
}
function totalTime(r) {
  return (r.prep || 0) + (r.cook || 0) + (r.rest || 0) + (r.freeze || 0);
}

/* index de recherche : noms 3 langues + categorie + mots-cles + tous les ingredients */
const _idx = new Map();
function searchIndex(r) {
  const cached = _idx.get(r.id);
  if (cached && cached.v === (r.modified || "") + "|" + r.ings.length) return cached.s;
  const parts = [r.n.ar, r.n.fr, r.n.en, r.kw || "",
    L(r.sub, "fr"), L(r.sub, "ar"), L(r.sub, "en")];
  const c = catById(r.cat);
  if (c) parts.push(c.ar, c.fr, c.en);
  const seen = {};
  for (let i = 0; i < r.ings.length; i++) {
    const id = r.ings[i].i;
    if (seen[id]) continue;
    seen[id] = 1;
    const g = ingById(id);
    if (g) parts.push(g.ar, g.fr, g.en);
  }
  const s = parts.join(" ").toLowerCase();
  _idx.set(r.id, { v: (r.modified || "") + "|" + r.ings.length, s: s });
  return s;
}
function norm(s) {
  return String(s || "").toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[\u064b-\u0652\u0670]/g, "")
    .replace(/[\u0623\u0625\u0622\u0671]/g, "\u0627")
    .replace(/\u0629/g, "\u0647")
    .replace(/\u0649/g, "\u064a")
    .replace(/\u0640/g, "");
}
function matches(r) {
  const q = norm(S.query.trim());
  if (q && norm(searchIndex(r)).indexOf(q) < 0) return false;
  const f = S.filter;
  if (f.cat && r.cat !== f.cat) return false;
  if (f.diff && r.diff > Number(f.diff)) return false;
  if (f.maxTime && totalTime(r) > Number(f.maxTime)) return false;
  if (f.minPort && (r.portions || 0) < Number(f.minPort)) return false;
  if (f.diet) {
    const d = dietById(f.diet);
    if (d) {
      const e = dietVerdict(r, d, 1).etat;
      if (e === "incompatible" || e === "au_dela") return false;
    }
  }
  return true;
}
function filtered() {
  const out = S.recipes.filter(matches);
  const l = S.lang;
  out.sort(function (a, b) {
    if (S.sort === "recent") return String(b.created || "").localeCompare(String(a.created || ""));
    if (S.sort === "time") return totalTime(a) - totalTime(b);
    if (S.sort === "diff") return (a.diff || 0) - (b.diff || 0);
    return L(a.n, l).localeCompare(L(b.n, l), l === "ar" ? "ar" : l);
  });
  return out;
}

/* ---------- persistance locale ---------- */
function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      lang: S.lang, ings: S.ings, recipes: S.recipes, stock: S.stock, shop: S.shop
    }));
  } catch (e) { /* quota : la base distante reste la reference */ }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d.lang) S.lang = d.lang;
    if (Array.isArray(d.ings) && d.ings.length) S.ings = d.ings;
    if (Array.isArray(d.recipes)) S.recipes = d.recipes;
    if (d.stock) S.stock = d.stock;
    if (d.shop) S.shop = d.shop;
    return Array.isArray(d.recipes) && d.recipes.length > 0;
  } catch (e) { return false; }
}
function cachePhoto(id, data) {
  S.photos[id] = data;
  try { localStorage.setItem("darhlou.ph." + id, data); } catch (e) { /* quota */ }
}
function readCachedPhoto(id) {
  if (S.photos[id] !== undefined) return S.photos[id];
  try {
    const v = localStorage.getItem("darhlou.ph." + id);
    if (v) { S.photos[id] = v; return v; }
  } catch (e) { /* ignore */ }
  return null;
}
function dropPhoto(id) {
  delete S.photos[id];
  try { localStorage.removeItem("darhlou.ph." + id); } catch (e) { /* ignore */ }
  if (S.db) S.db.doc("photos/" + id).delete().catch(function () {});
}

/* ---------- base distante ---------- */
function dbWrite(path, body) {
  if (!S.db) return Promise.resolve();
  return S.db.doc(path).set(body).catch(function (e) {
    if (e && e.code === "quota_exceeded") toast(t("err_save"));
    return null;
  });
}
/* Une seule porte de sortie pour chaque écriture : Supabase si
   l'authentification est active, sinon la base claude.ai, sinon rien
   (le stockage local a déjà été mis à jour par l'appelant). */
function ecrire(fnSupa, cheminDb, corpsDb) {
  if (typeof supaOn === "function" && supaOn()) {
    return fnSupa().catch(function (e) {
      if (e && e.code === 403) toast(t("d_no"));
      else toast(t("err_save"));
      return null;
    });
  }
  return dbWrite(cheminDb, corpsDb);
}
function pushRecipe(r) { return ecrire(function () { return supaSaveRecipe(r); }, "recipes/" + r.id, r); }
function pushIngs()    { return ecrire(supaSaveIngs, "catalog/ingredients", { items: S.ings }); }
function pushStock()   { return ecrire(supaSavePrefs, "catalog/stock", { items: S.stock }); }
function pushShop()    { return ecrire(supaSavePrefs, "state/shop", { items: S.shop }); }

async function seedAll() {
  S.ings = ING_SEED.concat(ING_SUBS_SEED, ING_SALE_SEED);
  S.recipes = allSeed();
  saveLocal();
  setLocalSeedVersion(SEED_VERSION);
  if (S.db) {
    await dbWrite("catalog/meta", { seeded: true, version: SEED_VERSION, at: today() });
    await pushIngs();
    for (const r of S.recipes) await pushRecipe(r);
  }
}

async function connectDb() {
  if (!(window.claude && typeof window.claude.use === "function")) return;
  let db = null;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) return;
  S.db = db;

  let meta = null;
  try { meta = await db.doc("catalog/meta").get(); } catch (e) { S.db = null; return; }

  if (!meta.exists) {
    if (!S.recipes.length) await seedAll();
    else {
      await dbWrite("catalog/meta", { seeded: true, version: SEED_VERSION, at: today() });
      await pushIngs(); await pushStock(); await pushShop();
      for (const r of S.recipes) await pushRecipe(r);
    }
  } else {
    const mv = Number((meta.data() && meta.data().version) || 1);
    if (mv < SEED_VERSION) {
      /* montee de version : on ajoute ce qui manque, on n'ecrase rien */
      let existing = {};
      try {
        const snap = await db.collection("recipes").limit(1000).get();
        snap.docs.forEach(function (d) { existing[d.id] = 1; });
      } catch (e) { existing = null; }
      if (existing) {
        const add = allSeed().filter(function (r) { return !existing[r.id]; });
        for (const r of add) await pushRecipe(r);
        mergeIngs(); saveLocal(); await pushIngs();
        await dbWrite("catalog/meta", { seeded: true, version: SEED_VERSION, at: today() });
      }
    }
  }
  S.synced = true;

  db.collection("recipes").onSnapshot(function (snap) {
    const list = [];
    snap.docs.forEach(function (d) { const v = d.data(); if (v && v.id) list.push(v); });
    /* un instantane vide alors que l'appareil a des recettes vient d'un cache froid,
       jamais d'une suppression totale : on ne l'applique pas. */
    if (!list.length && S.recipes.length) return;
    S.recipes = list;
    _idx.clear();
    saveLocal();
    if (S.booted) render();
  }, function () { S.synced = false; });

  db.doc("catalog/ingredients").onSnapshot(function (d) {
    const v = d.data();
    if (v && Array.isArray(v.items) && v.items.length) { S.ings = v.items; saveLocal(); if (S.booted) render(); }
  }, function () {});

  db.doc("catalog/stock").onSnapshot(function (d) {
    const v = d.data();
    if (v && v.items) { S.stock = v.items; saveLocal(); if (S.booted && S.screen === "stock") render(); }
  }, function () {});

  db.doc("state/shop").onSnapshot(function (d) {
    const v = d.data();
    if (v && v.items) { S.shop = v.items; saveLocal(); if (S.booted && S.screen === "shop") render(); }
  }, function () {});

  if (S.booted) render();
}

async function loadPhoto(id) {
  const c = readCachedPhoto(id);
  if (c) return c;
  if (!S.db) return null;
  try {
    const d = await S.db.doc("photos/" + id).get();
    const v = d.data();
    if (v && v.d) { cachePhoto(id, v.d); return v.d; }
  } catch (e) { /* ignore */ }
  S.photos[id] = null;
  return null;
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const el = $("#toast");
  el.innerHTML = "<div>" + esc(msg) + "</div>";
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
}

/* ---------- images : reduction cote client avant enregistrement ---------- */
function readImage(file) {
  return new Promise(function (resolve, reject) {
    const fr = new FileReader();
    fr.onload = function () {
      const img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("decode")); };
      img.src = fr.result;
    };
    fr.onerror = function () { reject(new Error("read")); };
    fr.readAsDataURL(file);
  });
}
function toJpeg(img, maxSide, budget, square) {
  let w = img.width, h = img.height;
  if (square) {
    const s = Math.min(w, h);
    const cv = document.createElement("canvas");
    cv.width = maxSide; cv.height = maxSide;
    cv.getContext("2d").drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, maxSide, maxSide);
    return squeeze(cv, budget);
  }
  const scale = Math.min(1, maxSide / Math.max(w, h));
  const cv = document.createElement("canvas");
  cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return squeeze(cv, budget);
}
function squeeze(cv, budget) {
  let q = 0.78, out = cv.toDataURL("image/jpeg", q);
  while (out.length > budget && q > 0.32) { q -= 0.08; out = cv.toDataURL("image/jpeg", q); }
  if (out.length > budget) {
    const cv2 = document.createElement("canvas");
    cv2.width = Math.round(cv.width * 0.7); cv2.height = Math.round(cv.height * 0.7);
    cv2.getContext("2d").drawImage(cv, 0, 0, cv2.width, cv2.height);
    out = cv2.toDataURL("image/jpeg", 0.62);
  }
  return out;
}
</script>

<script>
"use strict";

/* =====================================================================
   Rendu — coquille, accueil, liste, fiche
   ===================================================================== */

const TABS = [
  { id: "home",  ico: "⌂", key: "tab_home" },
  { id: "list",  ico: "◈", key: "tab_recipes" },
  { id: "shop",  ico: "☑", key: "tab_shop" },
  { id: "ings",  ico: "⚘", key: "tab_ing" },
  { id: "set",   ico: "⚙", key: "tab_set" }
];

function render() {
  const rtl = !!RTL[S.lang];
  document.documentElement.lang = S.lang;
  document.documentElement.dir = rtl ? "rtl" : "ltr";

  /* version protégée non configurée : ni recettes embarquées, ni base */
  if (!AUTH.actif && !S.recipes.length && !allSeed().length) {
    $("#app").innerHTML = gateCard("⚙", t("a_config_t"), t("a_config_b"), "");
    return;
  }

  /* porte d'accès : rien de l'application ne s'affiche sans approbation */
  if (AUTH.actif) {
    if (!AUTH.pret)                    { $("#app").innerHTML = scChecking(); return; }
    if (!AUTH.session)                 { $("#app").innerHTML = scLogin();    return; }
    if (AUTH.statut === "refuse")      { $("#app").innerHTML = scRefused();  return; }
    if (AUTH.statut !== "approuve")    { $("#app").innerHTML = scPending();  return; }
  }

  let body = "";
  switch (S.screen) {
    case "home":   body = scHome(); break;
    case "list":   body = scList(); break;
    case "recipe": body = scRecipe(); break;
    case "edit":   body = scEdit(); break;
    case "ings":   body = scIngs(); break;
    case "shop":   body = scShop(); break;
    case "stock":  body = scStock(); break;
    case "set":    body = scSettings(); break;
    case "admin":  body = scAdmin(); break;
    default:       body = scHome();
  }
  $("#app").innerHTML =
    topbar() +
    '<main><div class="wrap">' + body + "</div></main>" +
    tabbar();
  afterRender();
}

/* ---------- écrans d'accès ---------- */
function gateCard(mark, titre, corps, action, who) {
  return '<div class="gate"><div class="gatecard">' +
    '<div class="brand"><b>Siham</b> <span>Délice de Fès</span></div>' +
    (mark ? '<div class="mark" aria-hidden="true">' + mark + "</div>" : "") +
    "<h2>" + esc(titre) + "</h2>" +
    "<p>" + esc(corps) + "</p>" +
    (action || "") +
    (who ? '<p class="who">' + esc(who) + "</p>" : "") +
    "</div></div>";
}
function scLogin() {
  return gateCard("🍪", t("a_welcome"), t("a_intro"),
    '<button class="gbtn" data-act="signin">' + esc(t("a_signin")) + "</button>" +
    (AUTH.erreur ? '<p class="who" style="color:var(--danger)">' + esc(AUTH.erreur) + "</p>" : ""));
}
function scPending() {
  return gateCard("⏳", t("a_pending_t"), t("a_pending_b"),
    '<button class="btn ghost" data-act="signout">' + esc(t("a_signout")) + "</button>",
    AUTH.user ? AUTH.user.email : "");
}
function scRefused() {
  return gateCard("⊘", t("a_refused_t"), t("a_refused_b"),
    '<button class="btn ghost" data-act="signout">' + esc(t("a_signout")) + "</button>",
    AUTH.user ? AUTH.user.email : "");
}
function scChecking() {
  return gateCard("", t("a_checking"), "", "");
}
function scAdmin() {
  if (!estAdmin()) { S.screen = "set"; return scSettings(); }
  let h = '<div class="pad">' +
    '<button class="btn ghost sm" data-act="nav" data-v="set" style="margin-bottom:12px">← ' + esc(t("tab_set")) + "</button>" +
    '<h1 class="h-screen serif">' + esc(t("a_admin")) + "</h1>" +
    '<p class="sub">' + esc(t("a_admin_only")) + "</p>";
  if (S.demandes === null) {
    h += '<div class="empty">' + esc(t("loading")) + "</div>";
  } else if (!S.demandes.length) {
    h += '<div class="empty"><div class="big">✉</div><p>' + esc(t("a_none")) + "</p></div>";
  } else {
    const ordre = { en_attente: 0, approuve: 1, refuse: 2 };
    const rang = function (st) { return Object.prototype.hasOwnProperty.call(ordre, st) ? ordre[st] : 9; };
    const liste = S.demandes.slice().sort(function (a, b) {
      return rang(a.statut) - rang(b.statut);
    });
    h += '<div class="card">';
    liste.forEach(function (d) {
      const moi = AUTH.user && d.user_id === AUTH.user.id;
      const badge = d.statut === "approuve" ? '<span class="dv ok">' + esc(t("a_st_ok")) + "</span>"
                  : d.statut === "refuse" ? '<span class="dv no">' + esc(t("a_st_no")) + "</span>"
                  : '<span class="dv adapt">' + esc(t("a_st_wait")) + "</span>";
      let actions = "";
      if (!moi) {
        if (d.statut !== "approuve") actions += '<button class="btn sm primary" data-act="approve" data-v="' + esc(d.user_id) + '">' + esc(t("a_approve")) + "</button>";
        if (d.statut === "approuve") actions += '<button class="btn sm danger" data-act="refuse" data-v="' + esc(d.user_id) + '">' + esc(t("a_revoke")) + "</button>";
        else if (d.statut !== "refuse") actions += '<button class="btn sm danger" data-act="refuse" data-v="' + esc(d.user_id) + '">' + esc(t("a_refuse")) + "</button>";
      }
      h += '<div class="reqrow"><span class="who">' + esc(d.email || d.user_id) +
        (d.nom ? " <em>" + esc(d.nom) + "</em>" : "") +
        (moi ? ' <em>(' + esc(t("a_you")) + ")</em>" : "") + "</span>" +
        badge + '<span class="acts">' + actions + "</span></div>";
    });
    h += "</div>";
  }
  return h + "</div>";
}

function topbar() {
  return '<header class="topbar">' +
    '<div class="brand"><b>Siham</b> <span>Délice de Fès</span></div>' +
    '<div class="spacer"></div>' +
    '<div class="langsw" role="group" aria-label="' + esc(t("language")) + '">' +
      LANGS.map(function (l) {
        const lbl = l === "ar" ? "ع" : l === "fr" ? "FR" : "EN";
        return '<button data-act="lang" data-v="' + l + '" aria-pressed="' + (S.lang === l) + '">' + lbl + "</button>";
      }).join("") +
    "</div></header>";
}

function tabbar() {
  return '<nav class="tabbar" aria-label="' + esc(t("tab_home")) + '">' +
    TABS.map(function (tb) {
      const cur = (S.screen === tb.id) || (tb.id === "list" && (S.screen === "recipe" || S.screen === "edit"))
        || (tb.id === "shop" && S.screen === "stock");
      return '<button data-act="nav" data-v="' + tb.id + '"' + (cur ? ' aria-current="page"' : "") + ">" +
        '<span class="ico" aria-hidden="true">' + tb.ico + "</span>" +
        '<span class="lb">' + esc(t(tb.key)) + "</span></button>";
    }).join("") + "</nav>";
}

function afterRender() {
  const imgs = document.querySelectorAll("[data-photo]");
  imgs.forEach(function (el) {
    const id = el.getAttribute("data-photo");
    loadPhoto(id).then(function (d) {
      if (d && el.isConnected) { el.src = d; el.hidden = false; const ph = el.nextElementSibling; if (ph && ph.dataset.ph) ph.remove(); }
    });
  });
  const f = document.querySelector("[data-autofocus]");
  if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } }
}

/* ---------- petits composants ---------- */
function difficultyDots(d) {
  let h = '<span class="dots" aria-hidden="true">';
  for (let i = 1; i <= 3; i++) h += '<i class="' + (i <= d ? "on" : "") + '"></i>';
  return h + "</span>";
}
function thumbHtml(r) {
  if (r.thumb) return '<span class="thumb"><img src="' + esc(r.thumb) + '" alt=""></span>';
  return '<span class="thumb">' + illusSvg(r, false) + "</span>";
}
function recipeItem(r) {
  const c = catById(r.cat);
  return '<button class="ritem" data-act="open" data-v="' + esc(r.id) + '">' +
    thumbHtml(r) +
    '<span class="body">' +
      '<span class="nm">' + esc(L(r.n)) + "</span>" +
      '<span class="mt">' +
        (c ? "<span>" + esc(L(c)) + "</span>" : "") +
        "<span>" + esc(fmtTime(totalTime(r))) + "</span>" +
        "<span>" + difficultyDots(r.diff) + "</span>" +
      "</span>" +
    "</span></button>";
}
function searchBox(auto) {
  return '<div class="searchbox">' +
    '<span class="mag" aria-hidden="true">⌕</span>' +
    '<input type="search" inputmode="search" data-act="query" value="' + esc(S.query) + '"' +
      (auto ? " data-autofocus" : "") +
      ' placeholder="' + esc(t("search_ph")) + '" aria-label="' + esc(t("search_ph")) + '">' +
    (S.query ? '<button class="clr" data-act="clearq" aria-label="' + esc(t("clear")) + '">✕</button>' : "") +
    "</div>";
}

/* ---------- accueil ---------- */
function scHome() {
  const counts = {};
  S.recipes.forEach(function (r) { counts[r.cat] = (counts[r.cat] || 0) + 1; });
  const favs = S.recipes.filter(function (r) { return r.fav; });
  const recent = S.recipes.slice().sort(function (a, b) {
    return String(b.created || "").localeCompare(String(a.created || ""));
  }).slice(0, 4);

  let h = '<div class="pad">' +
    '<h1 class="h-screen serif">Siham <span style="color:var(--gold)">Délice de Fès</span></h1>' +
    '<p class="sub">' + esc(t("app_tag")) + " · " +
      '<span class="num">' + S.recipes.length + "</span> " + esc(t("tab_recipes").toLowerCase()) + "</p>" +
    searchBox(false);

  if (S.query.trim()) {
    const res = filtered();
    h += '<p class="eyebrow">' + '<span class="num">' + res.length + "</span> " +
      esc(res.length > 1 ? t("results_p") : t("results")) + "</p>";
    h += res.length
      ? '<div class="rlist">' + res.slice(0, 20).map(recipeItem).join("") + "</div>"
      : '<div class="empty"><div class="big">⌕</div><p>' + esc(t("none_found")) + "</p></div>";
    return h + "</div>";
  }

  h += '<p class="eyebrow">' + esc(t("categories")) + "</p><div class=\"tiles\">" +
    CATS.map(function (c) {
      const n = counts[c.id] || 0;
      return '<button class="tile" data-act="cat" data-v="' + c.id + '">' +
        '<span class="ico" aria-hidden="true">' + c.icon + "</span>" +
        '<span class="nm">' + esc(L(c)) + "</span>" +
        '<span class="ct"><span class="num">' + n + "</span> " + esc(n > 1 ? t("results_p") : t("results")) + "</span>" +
        "</button>";
    }).join("") + "</div>";

  if (favs.length) {
    h += '<p class="eyebrow">' + esc(t("favorites")) + '</p><div class="rlist">' +
      favs.map(recipeItem).join("") + "</div>";
  }
  h += '<p class="eyebrow">' + esc(t("recent")) + '</p><div class="rlist">' +
    recent.map(recipeItem).join("") + "</div>";

  h += '<div class="hr"></div><button class="btn primary block" data-act="new">+ ' +
    esc(t("new_recipe")) + "</button>";
  return h + "</div>";
}

/* ---------- liste et filtres ---------- */
function scList() {
  const res = filtered();
  const f = S.filter;
  const active = f.cat || f.diff || f.maxTime || f.minPort || f.diet;
  let h = '<div class="pad"><h1 class="h-screen serif">' + esc(t("all_recipes")) + "</h1>" + searchBox(false);

  h += '<div class="row" style="margin-bottom:12px">' +
    '<button class="chip" data-act="cat" data-v="" aria-pressed="' + (!f.cat) + '">' + esc(t("any")) + "</button>" +
    CATS.filter(function (c) { return S.recipes.some(function (r) { return r.cat === c.id; }); })
      .map(function (c) {
        return '<button class="chip" data-act="cat" data-v="' + c.id + '" aria-pressed="' + (f.cat === c.id) + '">' +
          c.icon + " " + esc(L(c)) + "</button>";
      }).join("") + "</div>";

  h += '<details class="card" style="padding:0 14px;margin-bottom:14px">' +
    '<summary style="padding:12px 0;cursor:pointer;font-size:14px;font-weight:500">' +
      esc(t("filters")) + " · " + esc(t("sort")) +
      (active ? ' <span class="badge">●</span>' : "") + "</summary>" +
    '<div style="padding-bottom:14px">' +
      '<div class="grid2">' +
        field(t("difficulty"), select("fdiff", f.diff, [["", t("any")], ["1", t("diff_1")], ["2", t("diff_2")], ["3", t("diff_3")]])) +
        field(t("max_time"), select("ftime", f.maxTime, [["", t("any")], ["30", "30 " + t("minutes")], ["60", "1 " + t("hours")], ["120", "2 " + t("hours")], ["240", "4 " + t("hours")]])) +
      "</div>" +
      '<div class="grid2">' +
        field(t("min_portions"), select("fport", f.minPort, [["", t("any")], ["4", "4"], ["6", "6"], ["8", "8"], ["10", "10"], ["12", "12"]])) +
        field(t("sort"), select("fsort", S.sort, [["name", t("sort_name")], ["recent", t("sort_recent")], ["time", t("sort_time")], ["diff", t("sort_diff")]])) +
      "</div>" +
      field(t("diet_filter"), select("fdietf", f.diet,
        [["", t("any")]].concat(DIETS.map(function (d) { return [d.id, d.ico + " " + L(d)]; })))) +
      (active ? '<button class="btn ghost sm" data-act="clearf">' + esc(t("clear")) + "</button>" : "") +
    "</div></details>";

  h += '<p class="eyebrow" style="margin-top:0"><span class="num">' + res.length + "</span> " +
    esc(res.length > 1 ? t("results_p") : t("results")) + "</p>";

  h += res.length
    ? '<div class="rlist">' + res.map(recipeItem).join("") + "</div>"
    : '<div class="empty"><div class="big">⌕</div><p>' + esc(t("none_found")) + "</p>" +
      '<p style="font-size:13.5px">' + esc(t("none_hint")) + "</p></div>";

  h += '<div class="hr"></div><button class="btn primary block" data-act="new">+ ' + esc(t("new_recipe")) + "</button>";

function field(label, inner) {
  return '<div class="field"><label>' + esc(label) + "</label>" + inner + "</div>";
}
function select(act, val, opts) {
  return '<select class="select" data-act="' + act + '">' +
    opts.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (String(val) === String(o[0]) ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    }).join("") + "</select>";
}

/* ---------- fiche recette ---------- */
function scRecipe() {
  const r = recipeById(S.recipeId);
  if (!r) { S.screen = "list"; return scList(); }
  const base = r.portions || 1;
  const p = S.portions || base;
  const k = p / base;
  const c = catById(r.cat);
  const cached = readCachedPhoto(r.id);

  let h = '<div class="hero">';
  if (cached) h += '<img src="' + esc(cached) + '" alt="">';
  else {
    h += '<img data-photo="' + esc(r.id) + '" alt="" hidden>' +
      '<span data-ph="1" class="ph">' +
      (r.thumb ? '<img src="' + esc(r.thumb) + '" alt="" style="width:100%;height:100%;object-fit:cover;filter:blur(6px)">'
               : illusSvg(r, true)) + "</span>";
  }
  h += "</div>";

  h += '<div class="detail-head">' +
    '<button class="btn ghost sm" data-act="nav" data-v="list" style="margin-bottom:12px">← ' + esc(t("back")) + "</button>" +
    '<h1 class="detail-title">' + esc(L(r.n)) + "</h1>" +
    '<div class="row" style="gap:7px;align-items:center;margin-bottom:4px">' +
      (c ? '<span class="badge">' + c.icon + " " + esc(L(c)) + "</span>" : "") +
      (L(r.sub) ? '<span class="muted" style="font-size:13.5px">' + esc(L(r.sub)) + "</span>" : "") +
    "</div>";

  const facts = [];
  facts.push([fmtNum(p), t("portions")]);
  if (r.prep) facts.push([fmtTime(r.prep), t("prep")]);
  if (r.cook) facts.push([fmtTime(r.cook), t("cook")]);
  if (r.rest) facts.push([fmtTime(r.rest), r.ice ? t("matur") : t("rest")]);
  if (r.freeze) facts.push([fmtTime(r.freeze), t("freeze")]);
  facts.push([t("diff_" + r.diff), t("difficulty")]);
  if (r.yieldQ) facts.push([fmtNum(r.yieldQ * (r.ice || r.yieldU === "pc" ? k : 1)) + " " + L(unitById(r.yieldU)), t("yield_")]);
  h += '<div class="facts">' + facts.map(function (f) {
    return '<div class="fact"><div class="v">' + f[0] + '</div><div class="k">' + esc(f[1]) + "</div></div>";
  }).join("") + "</div></div>";

  /* curseur de portions */
  h += '<div class="portions"><div class="line">' +
    '<span class="lbl">' + esc(t("portions_for")) + "</span>" +
    '<div class="stepper">' +
      '<button data-act="pminus" aria-label="−">−</button>' +
      '<span class="val num">' + esc(fmtNum(p)) + "</span>" +
      '<button data-act="pplus" aria-label="+">+</button>' +
    "</div></div>" +
    '<div class="quick">' +
      [[0.5, "×½"], [1, "×1"], [2, "×2"], [3, "×3"]].map(function (q) {
        const v = Math.max(1, Math.round(base * q[0]));
        return '<button data-act="pset" data-v="' + v + '" aria-pressed="' + (p === v) + '">' + q[1] + "</button>";
      }).join("") +
    "</div></div>";

  /* ingredients groupes — adaptes au régime actif le cas echeant */
  const dActif = S.diet ? dietById(S.diet) : null;
  const rv = dActif ? adaptRecipe(r, dActif) : r;
  h += '<div class="pad">';
  if (dActif) {
    h += '<div class="dietbar">' +
      '<span class="badge" style="background:var(--accent-wash);color:var(--accent)">' +
        dActif.ico + " " + esc(t("d_adapted")) + " · " + esc(L(dActif)) + "</span>" +
      '<button class="btn sm ghost" data-act="diet" data-v="">' + esc(t("d_original")) + "</button></div>";
  }
  h += '<p class="eyebrow" style="margin-top:6px">' + esc(t("ingredients")) + "</p>";
  const groups = {};
  rv.ings.forEach(function (it, i) { (groups[it.g] = groups[it.g] || []).push([it, i]); });
  const keys = GROUP_ORDER.filter(function (g) { return groups[g]; })
    .concat(Object.keys(groups).filter(function (g) { return GROUP_ORDER.indexOf(g) < 0; }));
  const multi = keys.length > 1;
  keys.forEach(function (g) {
    if (multi) h += '<div class="grp-title">' + esc(GROUPS[g] ? L(GROUPS[g]) : g) + "</div>";
    groups[g].forEach(function (pair) {
      const it = pair[0], i = pair[1];
      const gi = ingById(it.i);
      const key = r.id + ":i" + i;
      const done = S.checked[key] ? "1" : "0";
      const q = scaledQty(it, k);
      h += '<button class="ing" data-act="chk" data-v="' + esc(key) + '" data-done="' + done + '">' +
        '<span class="box" aria-hidden="true">✓</span>' +
        '<span class="nm">' + esc(gi ? L(gi) : it.i) +
          (it.rk ? " <em>· " + esc(L(it.rk)) + "</em>" : "") +
          (it.opt ? ' <em>(' + esc(t("optional")) + ")</em>" : "") +
          (it.remplace ? ' <em>· ' + esc(t("d_replaces")) + " " +
            esc(L(ingById(it.remplace) || {})) + "</em>" : "") +
        "</span>" +
        '<span class="qt' + (it.m === "fix" ? " manual" : "") + '">' + qtyLabel(q, it.u) + "</span>" +
        "</button>";
    });
  });

  /* etapes */
  h += '<p class="eyebrow">' + esc(t("steps")) + "</p>";
  r.steps.forEach(function (st, i) {
    const key = r.id + ":s" + i;
    h += '<button class="step" data-act="chk" data-v="' + esc(key) + '" data-done="' + (S.checked[key] ? "1" : "0") + '">' +
      '<span class="n num">' + (i + 1) + "</span>" +
      '<span class="tx">' + esc(L(st)) + "</span></button>";
  });

  /* fiche glace */
  if (r.ice) {
    h += '<p class="eyebrow">' + esc(t("ice_details")) + '</p><div class="facts">';
    const ice = [[L(r.ice.type), t("ice_type")], [L(r.ice.base), t("ice_base")], [L(r.ice.flavour), t("ice_flavour")]];
    if (r.ice.sugar) ice.push([fmtNum(r.ice.sugar) + " %", t("ice_sugar")]);
    if (r.ice.churn) ice.push([fmtTime(r.ice.churn), t("churn")]);
    if (L(r.ice.topping)) ice.push([L(r.ice.topping), t("ice_topping")]);
    h += ice.map(function (f) {
      return '<div class="fact"><div class="v" style="font-size:13.5px">' + esc(f[0]) + '</div><div class="k">' + esc(f[1]) + "</div></div>";
    }).join("") + "</div>";
  }

  /* régimes */
  h += '<p class="eyebrow">' + esc(t("diets")) + '</p><div class="card">';
  DIETS.forEach(function (d) {
    const v = dietVerdict(r, d, k);
    const lbl = v.etat === "compatible" ? t("d_ok")
              : v.etat === "adaptable" ? t("d_adapt")
              : v.etat === "au_dela" ? t("d_over") : t("d_no");
    const cls = v.etat === "compatible" ? "ok" : (v.etat === "adaptable" ? "adapt" : "no");
    const actionnable = (v.etat === "adaptable" || v.etat === "au_dela") && dietSubs(r, d).length > 0;
    let detail = "";
    if (v.valeur !== undefined) {
      detail = ' <em>' + esc(fmtNum(Math.round(v.valeur * 10) / 10)) + " " + d.unite +
        " · " + esc(t("d_threshold")) + " " + d.seuil + " " + d.unite + "</em>";
    } else if (v.etat === "incompatible") {
      detail = ' <em>· ' + esc(t("d_blocking")) + " : " +
        v.bloquants.slice(0, 3).map(function (x) { return esc(L(ingById(x) || {})); }).join(", ") + "</em>";
    } else if (v.note) {
      detail = ' <em>' + esc(t(v.note)) + "</em>";
    } else if (v.etat === "adaptable" && v.remplaces.length) {
      detail = ' <em>· ' + v.remplaces.slice(0, 3).map(function (x) { return esc(L(ingById(x) || {})); }).join(", ") + "</em>";
    }
    h += (actionnable
            ? '<button class="dietrow" data-act="diet" data-v="' + d.id + '">'
            : '<div class="dietrow">') +
      '<span class="di" aria-hidden="true">' + d.ico + "</span>" +
      '<span class="dn">' + esc(L(d)) + detail + "</span>" +
      '<span class="dv ' + cls + '">' + esc(lbl) + "</span>" +
      (actionnable ? "</button>" : "</div>");
  });
  h += "</div>";

  /* estimation nutritionnelle */
  const nu = recipeNutri(rv, k);
  h += '<p class="eyebrow">' + esc(t("nutri")) + '</p><div class="facts">' +
    '<div class="fact"><div class="v">' + esc(fmtNum(Math.round(nu.p * 10) / 10)) + ' g</div><div class="k">' + esc(t("n_prot")) + "</div></div>" +
    '<div class="fact"><div class="v">' + esc(fmtNum(Math.round(nu.s * 10) / 10)) + ' g</div><div class="k">' + esc(t("n_sugar")) + "</div></div>" +
    '<div class="fact"><div class="v">' + esc(fmtNum(Math.round(nu.na))) + ' mg</div><div class="k">' + esc(t("n_sodium")) + "</div></div>" +
    "</div>" +
    '<p class="muted" style="font-size:12.5px;line-height:1.5">' + esc(t("n_warning")) + "</p>";

  if (L(r.tips)) h += '<p class="eyebrow">' + esc(t("tips")) + '</p><div class="tipbox">' + esc(L(r.tips)) + "</div>";
  if (L(r.notes)) h += '<p class="eyebrow">' + esc(t("notes")) + '</p><p>' + esc(L(r.notes)) + "</p>";

  const inShop = Object.prototype.hasOwnProperty.call(S.shop, r.id);
  h += '<div class="actbar">' +
    '<button class="btn' + (inShop ? "" : " primary") + '" data-act="toshop" data-v="' + esc(r.id) + '">' +
      esc(inShop ? t("in_shop") : t("add_to_shop")) + "</button>" +
    '<button class="btn" data-act="printr" data-v="' + esc(r.id) + '">' + esc(t("print")) + "</button>" +
    '<button class="btn" data-act="editr" data-v="' + esc(r.id) + '">' + esc(t("edit")) + "</button>" +
    '<button class="btn" data-act="dupr" data-v="' + esc(r.id) + '">' + esc(t("duplicate")) + "</button>" +
    '<button class="btn danger" data-act="delr" data-v="' + esc(r.id) + '">' + esc(t("del")) + "</button>" +
    "</div></div>";
  return h;
}
</script>

<script>
"use strict";

/* =====================================================================
   Rendu — editeur, catalogue, courses, stock, reglages
   ===================================================================== */

const SCALE_MODES = [["lin", "scale_lin"], ["fix", "scale_fix"], ["root", "scale_root"]];

function scEdit() {

  h += '<div class="grid2">' +
    field(t("base_portions"), '<input class="input" type="number" min="1" inputmode="numeric" data-f="portions" value="' + esc(d.portions) + '">') +
    field(t("yield_"), '<div class="row" style="flex-wrap:nowrap;gap:6px">' +
      '<input class="input" type="number" min="0" inputmode="decimal" data-f="yieldQ" value="' + esc(d.yieldQ || "") + '" style="flex:1">' +
      '<select class="select" data-act="fyu" style="flex:0 0 108px">' + UNITS.map(function (u) {
        return '<option value="' + u.id + '"' + (d.yieldU === u.id ? " selected" : "") + ">" + esc(L(u)) + "</option>";
      }).join("") + "</select></div>") +
    "</div>";

  h += '<div class="grid2">' +
    field(t("prep") + " (" + t("minutes") + ")", '<input class="input" type="number" min="0" inputmode="numeric" data-f="prep" value="' + esc(d.prep) + '">') +
    field(t("cook") + " (" + t("minutes") + ")", '<input class="input" type="number" min="0" inputmode="numeric" data-f="cook" value="' + esc(d.cook) + '">') +
    "</div><div class=\"grid2\">" +
    field((d.ice ? t("matur") : t("rest")) + " (" + t("minutes") + ")", '<input class="input" type="number" min="0" inputmode="numeric" data-f="rest" value="' + esc(d.rest) + '">') +
    field(t("freeze") + " (" + t("minutes") + ")", '<input class="input" type="number" min="0" inputmode="numeric" data-f="freeze" value="' + esc(d.freeze) + '">') +
    "</div>";

  h += field(t("keywords"), '<input class="input" data-f="kw" value="' + esc(d.kw || "") + '">');

  /* ingredients */
  h += '<p class="eyebrow">' + esc(t("ingredients")) + "</p>";
  d.ings.forEach(function (it, i) {
    const gi = ingById(it.i);
    h += '<div class="erow"><div class="top">' +
      '<button class="btn sm ghost" data-act="pickings" data-v="' + i + '" style="flex:1;justify-content:flex-start">' +

      "</div>" +
      '<div class="row" style="flex-wrap:nowrap;gap:6px;margin-bottom:6px">' +
        '<input class="input" type="number" step="any" inputmode="decimal" data-f="ings.' + i + '.q" value="' + esc(it.q) + '" style="flex:1" aria-label="' + esc(t("quantity")) + '">' +
        '<select class="select" data-act="iu" data-v="' + i + '" style="flex:0 0 118px" aria-label="' + esc(t("unit")) + '">' +
          UNITS.map(function (u) { return '<option value="' + u.id + '"' + (it.u === u.id ? " selected" : "") + ">" + esc(L(u)) + "</option>"; }).join("") +
        "</select></div>" +
      '<div class="row" style="flex-wrap:nowrap;gap:6px">' +
        '<select class="select" data-act="ig" data-v="' + i + '" style="flex:1" aria-label="' + esc(t("group")) + '">' +
          GROUP_ORDER.map(function (g) { return '<option value="' + g + '"' + (it.g === g ? " selected" : "") + ">" + esc(L(GROUPS[g])) + "</option>"; }).join("") +
        "</select>" +
        '<select class="select" data-act="im" data-v="' + i + '" style="flex:1" aria-label="' + esc(t("scaling")) + '">' +
          SCALE_MODES.map(function (m) { return '<option value="' + m[0] + '"' + (it.m === m[0] ? " selected" : "") + ">" + esc(t(m[1])) + "</option>"; }).join("") +
        "</select></div></div>";
  });
  h += '<p class="muted" style="font-size:12.5px;margin:-2px 0 10px">' + esc(t("scale_help")) + "</p>";
  h += '<button class="btn block ghost" data-act="addingrow">+ ' + esc(t("add_ing")) + "</button>";

  /* etapes */
  h += '<p class="eyebrow">' + esc(t("steps")) + "</p>";
  d.steps.forEach(function (st, i) {
    h += '<div class="erow"><div class="top">' +
      '<span class="nm">' + esc(t("step_n")) + ' <span class="num">' + (i + 1) + "</span></span>" +
      '<button class="iconbtn" data-act="stepup" data-v="' + i + '" aria-label="↑"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
      '<button class="iconbtn danger" data-act="delstep" data-v="' + i + '" aria-label="' + esc(t("del")) + '">✕</button>' +
      "</div>" +
      '<textarea class="textarea" data-f="steps.' + i + "." + dl + '"' + (dl === "ar" ? ' dir="rtl"' : ' dir="ltr"') + ">" +
        esc(st[dl] || "") + "</textarea></div>";
  });
  h += '<button class="btn block ghost" data-act="addstep">+ ' + esc(t("add_step")) + "</button>";

  h += '<p class="eyebrow">' + esc(t("tips")) + "</p>" +
    '<textarea class="textarea" data-f="tips.' + dl + '"' + (dl === "ar" ? ' dir="rtl"' : ' dir="ltr"') + ">" + esc(d.tips[dl] || "") + "</textarea>" +
    '<p class="eyebrow">' + esc(t("notes")) + "</p>" +
    '<textarea class="textarea" data-f="notes.' + dl + '"' + (dl === "ar" ? ' dir="rtl"' : ' dir="ltr"') + ">" + esc(d.notes[dl] || "") + "</textarea>";

  h += '<div class="hr"></div><div class="row" style="flex-wrap:nowrap">' +
    '<button class="btn primary" data-act="saver" style="flex:1">' + esc(t("save")) + "</button>" +
    '<button class="btn ghost" data-act="canceledit">' + esc(t("cancel")) + "</button></div>";
  return h + "</div>";
}

/* ---------- catalogue d'ingredients ---------- */
function scIngs() {
  const usage = {};
  S.recipes.forEach(function (r) {
    const seen = {};
    r.ings.forEach(function (it) { if (!seen[it.i]) { seen[it.i] = 1; usage[it.i] = (usage[it.i] || 0) + 1; } });
  });
  const q = norm(S.query);
  let h = '<div class="pad"><h1 class="h-screen serif">' + esc(t("tab_ing")) + "</h1>" +
    '<p class="sub"><span class="num">' + S.ings.length + "</span> " + esc(t("tab_ing").toLowerCase()) + "</p>" +
    searchBox(false);

  ICATS.forEach(function (ic) {
    const list = S.ings.filter(function (g) {
      if (g.cat !== ic.id) return false;
      if (!q) return true;
      return norm(g.ar + " " + g.fr + " " + g.en).indexOf(q) >= 0;
    }).sort(function (a, b) { return L(a).localeCompare(L(b), S.lang); });
    if (!list.length) return;
    h += '<p class="eyebrow">' + esc(L(ic)) + '</p><div class="card">';
    list.forEach(function (g) {
      const n = usage[g.id] || 0;
      h += '<button class="pick" data-act="editing" data-v="' + esc(g.id) + '">' +
        '<span class="nm">' + esc(L(g)) + "</span>" +
        '<span class="sec">' + esc(L(unitById(g.unit))) +
          (n ? " · <span class=\"num\">" + n + "</span> " + esc(t("recipes_n")) : "") + "</span></button>";
    });
    h += "</div>";
  });
  h += '<div class="hr"></div><button class="btn primary block" data-act="newing">+ ' + esc(t("new_ing")) + "</button>";
  return h + "</div>";
}

/* ---------- agregation de la liste de courses ---------- */
function shoppingTotals() {
  const totals = {};
  Object.keys(S.shop).forEach(function (rid) {
    const r = recipeById(rid);
    if (!r) return;
    const k = (S.shop[rid] || r.portions) / (r.portions || 1);
    r.ings.forEach(function (it) {
      const g = ingById(it.i);
      const u = unitById(it.u);
      const q = scaledQty(it, k);
      if (!totals[it.i]) totals[it.i] = { id: it.i, amount: 0, target: g ? unitById(g.unit).type : u.type, misc: [] };
      const T2 = totals[it.i];
      const dens = g && g.dens > 0 ? g.dens : 0;
      if (u.type === "misc") { T2.misc.push(it.u); return; }
      if (T2.target === "mass") {
        if (u.type === "mass") T2.amount += q * u.factor;
        else if (u.type === "vol" && dens) T2.amount += q * u.factor * dens;
        else { T2.target = u.type; T2.amount += q * u.factor; }
      } else if (T2.target === "vol") {
        if (u.type === "vol") T2.amount += q * u.factor;
        else if (u.type === "mass" && dens) T2.amount += (q * u.factor) / dens;
        else { T2.target = u.type; T2.amount += q * u.factor; }
      } else {
        T2.amount += q * u.factor;
      }
    });
  });
  return totals;
}
function baseUnitFor(type) { return type === "mass" ? "g" : type === "vol" ? "ml" : "pc"; }

function stockBase(ingId, type) {
  const st = S.stock[ingId];
  if (!st || !st.q) return null;
  const u = unitById(st.u);
  const g = ingById(ingId);
  const dens = g && g.dens > 0 ? g.dens : 0;
  if (u.type === type) return st.q * u.factor;
  if (type === "mass" && u.type === "vol" && dens) return st.q * u.factor * dens;
  if (type === "vol" && u.type === "mass" && dens) return (st.q * u.factor) / dens;
  return null;
}

function scShop() {
  const ids = Object.keys(S.shop);
  let h = '<div class="pad"><h1 class="h-screen serif">' + esc(t("shop_title")) + "</h1>";

  if (!ids.length) {
    h += '<div class="empty"><div class="big">☑</div><p>' + esc(t("shop_empty")) + "</p>" +
      '<p style="font-size:13.5px">' + esc(t("shop_hint")) + "</p></div>" +
      '<button class="btn primary block" data-act="shoppick">+ ' + esc(t("shop_add")) + "</button>" +
      '<div class="hr"></div><button class="btn ghost block" data-act="nav" data-v="stock">' + esc(t("stock_title")) + "</button></div>";
    return h;
  }

  h += '<p class="eyebrow" style="margin-top:8px">' + esc(t("selected")) + '</p><div class="card">';
  ids.forEach(function (rid) {
    const r = recipeById(rid);
    if (!r) return;
    h += '<div class="sl-item">' +
      '<span class="nm">' + esc(L(r.n)) + "</span>" +
      '<span class="stepper" style="transform:scale(.85)">' +
        '<button data-act="sminus" data-v="' + esc(rid) + '" aria-label="−">−</button>' +
        '<span class="val num">' + esc(fmtNum(S.shop[rid])) + "</span>" +
        '<button data-act="splus" data-v="' + esc(rid) + '" aria-label="+">+</button>' +
      "</span>" +
      '<button class="iconbtn danger" data-act="unshop" data-v="' + esc(rid) + '" aria-label="' + esc(t("del")) + '">✕</button>' +
      "</div>";
  });
  h += "</div>";
  h += '<div class="row" style="margin:12px 0"><button class="btn sm" data-act="shoppick">+ ' + esc(t("shop_add")) + "</button>" +
    '<button class="btn sm ghost" data-act="clearshop">' + esc(t("shop_clear")) + "</button></div>";

  const totals = shoppingTotals();
  const keys = Object.keys(totals).sort(function (a, b) {
    const ga = ingById(a), gb = ingById(b);
    const ca = ga ? ga.cat : "i11", cb = gb ? gb.cat : "i11";
    if (ca !== cb) return ca.localeCompare(cb, "en", { numeric: true });
    return L(ga || {}).localeCompare(L(gb || {}), S.lang);
  });

  h += '<p class="eyebrow">' + esc(t("shop_list")) + '</p><div class="card">';
  let lastCat = null;
  keys.forEach(function (id) {
    const T2 = totals[id];
    const g = ingById(id);
    if (g && g.cat !== lastCat) {
      lastCat = g.cat;
      const ic = ICATS.filter(function (c) { return c.id === g.cat; })[0];
      h += '<div class="grp-title" style="padding:8px 13px 2px;margin:0">' + esc(ic ? L(ic) : "") + "</div>";
    }
    const key = "shop:" + id;
    let qty;
    if (T2.amount > 0) qty = qtyLabel(T2.amount, baseUnitFor(T2.target));
    else if (T2.misc.length) qty = esc(t("qs"));
    else qty = "—";
    const sb = stockBase(id, T2.target);
    let flag = "";
    if (T2.amount > 0 && sb !== null) {
      flag = sb >= T2.amount
        ? '<span class="stockflag ok">' + esc(t("in_stock")) + "</span>"
        : '<span class="stockflag no">' + esc(t("to_buy")) + "</span>";
    }
    h += '<button class="sl-item" data-act="chk" data-v="' + esc(key) + '" data-done="' + (S.checked[key] ? "1" : "0") + '">' +
      '<span class="nm">' + esc(g ? L(g) : id) + "</span>" + flag +
      '<span class="qt">' + qty + "</span></button>";
  });
  h += "</div>";

  h += '<div class="actbar">' +
    '<button class="btn" data-act="printshop">' + esc(t("print")) + "</button>" +
    '<button class="btn" data-act="csvshop">CSV</button>' +
    '<button class="btn ghost" data-act="nav" data-v="stock">' + esc(t("stock_title")) + "</button></div>";
  return h + "</div>";
}

/* ---------- stock ---------- */
function scStock() {
  const ids = Object.keys(S.stock).filter(function (k) { return S.stock[k] && S.stock[k].q; });
  let h = '<div class="pad">' +
    '<button class="btn ghost sm" data-act="nav" data-v="shop" style="margin-bottom:12px">← ' + esc(t("tab_shop")) + "</button>" +
    '<h1 class="h-screen serif">' + esc(t("stock_title")) + "</h1>" +
    '<p class="sub">' + esc(t("stock_hint")) + "</p>";

  if (!ids.length) h += '<div class="empty"><div class="big">⚘</div><p>' + esc(t("stock_hint")) + "</p></div>";
  else {
    ids.sort(function (a, b) { return L(ingById(a) || {}).localeCompare(L(ingById(b) || {}), S.lang); });
    h += '<div class="card" style="padding:6px 10px">';
    ids.forEach(function (id) {
      const g = ingById(id), st = S.stock[id];
      h += '<div class="erow" style="border:0;margin-bottom:2px;padding:8px 4px">' +
        '<div class="top"><span class="nm">' + esc(g ? L(g) : id) + "</span>" +
        '<button class="iconbtn danger" data-act="delstock" data-v="' + esc(id) + '" aria-label="' + esc(t("del")) + '">✕</button></div>' +
        '<div class="row" style="flex-wrap:nowrap;gap:6px">' +
          '<input class="input" type="number" step="any" inputmode="decimal" data-f="stock.' + esc(id) + '.q" value="' + esc(st.q) + '" style="flex:1">' +
          '<select class="select" data-act="su" data-v="' + esc(id) + '" style="flex:0 0 118px">' +
            UNITS.map(function (u) { return '<option value="' + u.id + '"' + (st.u === u.id ? " selected" : "") + ">" + esc(L(u)) + "</option>"; }).join("") +
          "</select></div></div>";
    });
    h += "</div>";
  }
  h += '<div class="hr"></div><button class="btn primary block" data-act="stockpick">+ ' + esc(t("add")) + "</button>";
  return h + "</div>";
}

/* ---------- reglages ---------- */
function scSettings() {
  const pl = S.printLang || S.lang;
  let h = '<div class="pad"><h1 class="h-screen serif">' + esc(t("tab_set")) + "</h1>";

  h += '<p class="eyebrow" style="margin-top:14px">' + esc(t("language")) + '</p><div class="row">' +
    LANGS.map(function (l) {
      return '<button class="chip" data-act="lang" data-v="' + l + '" aria-pressed="' + (S.lang === l) + '" style="height:44px;padding:0 20px">' +
        (l === "ar" ? "العربية" : l === "fr" ? "Français" : "English") + "</button>";
    }).join("") + "</div>";

  h += '<p class="eyebrow">' + esc(t("print_lang")) + '</p><div class="row">' +
    LANGS.map(function (l) {
      return '<button class="chip" data-act="plang" data-v="' + l + '" aria-pressed="' + (pl === l) + '" style="height:44px;padding:0 20px">' +
        (l === "ar" ? "العربية" : l === "fr" ? "Français" : "English") + "</button>";
    }).join("") +
    "</div><p class=\"muted\" style=\"font-size:13px;margin-top:8px\">" + esc(t("print_hint")) + "</p>";

  h += '<p class="eyebrow">' + esc(t("counts")) + '</p><div class="facts">' +

    "</div>";

  h += '<div class="card" style="padding:15px 17px;margin:14px 0">' +

      (S.synced ? "● " + esc(t("sync_on")) : "○ " + esc(t("sync_off"))) + "</div>" +
    '<div class="muted" style="font-size:13px">' + esc(S.synced ? "" : t("sync_off_h")) + "</div></div>";

  h += '<p class="eyebrow">' + esc(t("data")) + '</p>' +
    '<div class="row" style="flex-direction:column;align-items:stretch">' +
      '<button class="btn" data-act="csvrec">' + esc(t("export_csv")) + " · " + esc(t("tab_recipes")) + "</button>" +
      '<button class="btn" data-act="csvsteps">' + esc(t("export_csv")) + " · " + esc(t("steps")) + "</button>" +
      '<button class="btn" data-act="csving">' + esc(t("export_csv")) + " · " + esc(t("tab_ing")) + "</button>" +
      '<button class="btn" data-act="jsonout">' + esc(t("export_json")) + "</button>" +
      '<button class="btn ghost" data-act="jsonin">' + esc(t("import_json")) + "</button>" +
      '<button class="btn ghost" data-act="reseed">' + esc(t("reseed")) + "</button>" +
    "</div>";

  if (AUTH.actif && AUTH.session) {
    h += '<p class="eyebrow">' + esc(t("a_admin")) + '</p><div class="card" style="padding:14px 16px">' +
      '<div style="font-size:14px;margin-bottom:10px">' + esc(AUTH.user ? AUTH.user.email : "") +
      (estAdmin() ? ' <span class="badge">' + esc(t("a_admin")) + "</span>" : "") + "</div>" +
      '<div class="row">' +
      (estAdmin() ? '<button class="btn sm" data-act="nav" data-v="admin">' + esc(t("a_requests")) + "</button>" : "") +
      '<button class="btn sm ghost" data-act="signout">' + esc(t("a_signout")) + "</button>" +
      "</div></div>";
  }

  h += '<p class="eyebrow">' + esc(t("about")) + '</p>' +
    '<p class="muted" style="font-size:13.5px">Siham Délice de Fès — ' + esc(t("app_tag")) +
    ". Données : recettes, ingrédients, unités, stock et courses, selon le modèle du dossier d'architecture.</p>";
  return h + "</div>";
}

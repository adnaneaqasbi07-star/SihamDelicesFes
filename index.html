<script>
"use strict";

/* =====================================================================
   Feuilles modales, impression A4, exports, interactions
   ===================================================================== */

/* ---------- feuilles modales ---------- */
function sheetHtml() {
  const sh = S.sheet;
  if (!sh) return "";
  let inner = "";

  if (sh.type === "ingpick" || sh.type === "stockpick") {
    const q = norm(sh.q || "");
    const list = S.ings.filter(function (g) {
      return !q || norm(g.ar + " " + g.fr + " " + g.en).indexOf(q) >= 0;
    }).sort(function (a, b) { return L(a).localeCompare(L(b), S.lang); });
    inner = "<h3>" + esc(t("pick_ing")) + "</h3>" +
      '<input class="input" data-act="sheetq" data-autofocus value="' + esc(sh.q || "") + '" placeholder="' + esc(t("search_ph")) + '" style="margin-bottom:10px">' +
      '<div class="picklist">' +
        (list.length ? list.map(function (g) {
          const ic = ICATS.filter(function (c) { return c.id === g.cat; })[0];
          return '<button class="pick" data-act="sheetpick" data-v="' + esc(g.id) + '">' +
            '<span class="nm">' + esc(L(g)) + "</span>" +
            '<span class="sec">' + esc(ic ? L(ic) : "") + "</span></button>";
        }).join("") : '<p class="empty">' + esc(t("none_found")) + "</p>") +
      "</div>" +
      '<button class="btn ghost block" data-act="newing" style="margin-top:12px">+ ' + esc(t("new_ing")) + "</button>";
  }

  else if (sh.type === "recipepick") {
    const q = norm(sh.q || "");
    const list = S.recipes.filter(function (r) {
      return !q || norm(searchIndex(r)).indexOf(q) >= 0;
    }).sort(function (a, b) { return L(a.n).localeCompare(L(b.n), S.lang); });
    inner = "<h3>" + esc(t("shop_pick")) + "</h3>" +
      '<input class="input" data-act="sheetq" data-autofocus value="' + esc(sh.q || "") + '" placeholder="' + esc(t("search_ph")) + '" style="margin-bottom:10px">' +
      '<div class="picklist">' + list.map(function (r) {
        const on = Object.prototype.hasOwnProperty.call(S.shop, r.id);
        return '<button class="pick" data-act="sheetrecipe" data-v="' + esc(r.id) + '">' +
          '<span class="nm">' + esc(L(r.n)) + "</span>" +
          '<span class="sec">' + (on ? "✓" : "+") + "</span></button>";
      }).join("") + "</div>";
  }

  else if (sh.type === "ingform") {
    const g = sh.ing;
    inner = "<h3>" + esc(g.id ? t("edit") : t("new_ing")) + "</h3>" +
      field(t("name_fr"), '<input class="input" data-g="fr" value="' + esc(g.fr || "") + '" dir="ltr" data-autofocus>') +
      field(t("name_ar"), '<input class="input" data-g="ar" value="' + esc(g.ar || "") + '" dir="rtl">') +
      field(t("name_en"), '<input class="input" data-g="en" value="' + esc(g.en || "") + '" dir="ltr">') +
      '<div class="grid2">' +
        field(t("ing_cat"), '<select class="select" data-g="cat">' + ICATS.map(function (c) {
          return '<option value="' + c.id + '"' + (g.cat === c.id ? " selected" : "") + ">" + esc(L(c)) + "</option>";
        }).join("") + "</select>") +
        field(t("usual_unit"), '<select class="select" data-g="unit">' + UNITS.map(function (u) {
          return '<option value="' + u.id + '"' + (g.unit === u.id ? " selected" : "") + ">" + esc(L(u)) + "</option>";
        }).join("") + "</select>") +
      "</div>" +
      field(t("density"), '<input class="input" type="number" step="any" inputmode="decimal" data-g="dens" value="' + esc(g.dens || "") + '">') +
      '<p class="muted" style="font-size:12.5px;margin-top:-8px">' + esc(t("density_help")) + "</p>" +
      '<div class="row" style="flex-wrap:nowrap;margin-top:8px">' +
        '<button class="btn primary" data-act="saveing" style="flex:1">' + esc(t("save")) + "</button>" +
        '<button class="btn ghost" data-act="sheetclose">' + esc(t("cancel")) + "</button></div>";
  }

  else if (sh.type === "confirm") {
    inner = "<h3>" + esc(sh.title) + "</h3>" +
      "<p>" + esc(sh.body || "") + "</p>" +
      '<div class="row" style="flex-wrap:nowrap;margin-top:14px">' +
        '<button class="btn danger" data-act="confirmyes" style="flex:1">' + esc(sh.ok || t("del")) + "</button>" +
        '<button class="btn ghost" data-act="sheetclose">' + esc(t("cancel")) + "</button></div>";
  }

  return '<div class="sheet-bg" data-act="sheetbg"><div class="sheet" role="dialog" aria-modal="true">' +
    '<button class="sheet-close" data-act="sheetclose" aria-label="' + esc(t("cancel")) + '">✕</button>' +
    inner + "</div></div>";
}

let sheetNode = null;
function syncSheet() {
  if (sheetNode) { sheetNode.remove(); sheetNode = null; }
  const html = sheetHtml();
  if (!html) return;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  sheetNode = wrap.firstElementChild;
  document.body.appendChild(sheetNode);
  const f = sheetNode.querySelector("[data-autofocus]");
  if (f) {
    try {
      f.focus({ preventScroll: true });
      const n = f.value ? f.value.length : 0;
      if (f.setSelectionRange) f.setSelectionRange(n, n);
    } catch (e) { try { f.focus(); } catch (e2) {} }
  }
}
const baseRender = render;
render = function () { baseRender(); syncSheet(); };

/* ---------- impression A4 ---------- */
function printFacts(r, p, lang) {
  const out = [[fmtNum(p), t("portions", lang)]];
  if (r.prep) out.push([fmtTime(r.prep, lang), t("prep", lang)]);
  if (r.cook) out.push([fmtTime(r.cook, lang), t("cook", lang)]);
  if (r.rest) out.push([fmtTime(r.rest, lang), r.ice ? t("matur", lang) : t("rest", lang)]);
  if (r.freeze) out.push([fmtTime(r.freeze, lang), t("freeze", lang)]);
  out.push([t("diff_" + r.diff, lang), t("difficulty", lang)]);
  return out;
}
function printRecipe(id) {
  const r = recipeById(id);
  if (!r) return;
  const lang = S.printLang || S.lang;
  const rtl = !!RTL[lang];
  const base = r.portions || 1;
  const p = S.portions || base;
  const k = p / base;
  const c = catById(r.cat);
  const photo = readCachedPhoto(r.id) || r.thumb;

  const groups = {};
  r.ings.forEach(function (it) { (groups[it.g] = groups[it.g] || []).push(it); });
  const keys = GROUP_ORDER.filter(function (g) { return groups[g]; })
    .concat(Object.keys(groups).filter(function (g) { return GROUP_ORDER.indexOf(g) < 0; }));
  const multi = keys.length > 1;

  let ing = "";
  keys.forEach(function (g) {
    if (multi) ing += '<div class="p-grp">' + esc(GROUPS[g] ? L(GROUPS[g], lang) : g) + "</div>";
    groups[g].forEach(function (it) {
      const gi = ingById(it.i);
      ing += '<div class="p-ing"><span>' + esc(gi ? L(gi, lang) : it.i) +
        (it.rk ? " <i>· " + esc(L(it.rk, lang)) + "</i>" : "") + "</span>" +
        '<span class="q">' + qtyLabel(scaledQty(it, k), it.u, lang) + "</span></div>";
    });
  });

  let steps = "";
  r.steps.forEach(function (st, i) {
    steps += '<div class="p-step"><span class="n">' + (i + 1) + ".</span><span>" + esc(L(st, lang)) + "</span></div>";
  });

  let ice = "";
  if (r.ice) {
    const bits = [];
    if (L(r.ice.type, lang)) bits.push(t("ice_type", lang) + " : " + L(r.ice.type, lang));
    if (L(r.ice.base, lang)) bits.push(t("ice_base", lang) + " : " + L(r.ice.base, lang));
    if (r.ice.sugar) bits.push(t("ice_sugar", lang) + " : " + fmtNum(r.ice.sugar) + " %");
    if (r.ice.churn) bits.push(t("churn", lang) + " : " + fmtTime(r.ice.churn, lang));
    if (bits.length) ice = '<div class="p-tip"><b>' + esc(t("ice_details", lang)) + "</b><br>" + esc(bits.join(" · ")) + "</div>";
  }

  const el = $("#print");
  el.setAttribute("dir", rtl ? "rtl" : "ltr");
  el.setAttribute("lang", lang);
  el.innerHTML =
    '<div class="p-head"><span class="p-brand">Siham <span>Délice de Fès</span></span>' +
      '<span class="p-cat">' + esc(c ? L(c, lang) : "") + "</span></div>" +
    "<h1>" + esc(L(r.n, lang)) + "</h1>" +
    (L(r.sub, lang) ? '<p style="margin:0 0 4mm;color:#666">' + esc(L(r.sub, lang)) + "</p>" : "") +
    (photo ? '<img class="p-img" src="' + esc(photo) + '" alt="">' : '<div class="p-illus">' + illusSvg(r, true) + '</div>') +
    '<div class="p-facts">' + printFacts(r, p, lang).map(function (f) {
      return '<div class="p-fact"><div class="v">' + esc(f[0]) + '</div><div class="k">' + esc(f[1]) + "</div></div>";
    }).join("") + "</div>" +
    '<div class="p-cols"><div><h2>' + esc(t("ingredients", lang)) + "</h2>" + ing + "</div>" +
      "<div><h2>" + esc(t("steps", lang)) + "</h2>" + steps + ice +
      (L(r.tips, lang) ? '<div class="p-tip"><b>' + esc(t("tips", lang)) + "</b><br>" + esc(L(r.tips, lang)) + "</div>" : "") +
      (L(r.notes, lang) ? '<div class="p-tip"><b>' + esc(t("notes", lang)) + "</b><br>" + esc(L(r.notes, lang)) + "</div>" : "") +
      "</div></div>" +
    '<div class="p-foot"><span>Siham Délice de Fès</span><span>' + esc(today()) + "</span></div>";
  setTimeout(function () { window.print(); }, 80);
}

function printShopping() {
  const lang = S.printLang || S.lang;
  const totals = shoppingTotals();
  const keys = Object.keys(totals).sort(function (a, b) {
    const ga = ingById(a), gb = ingById(b);
    const ca = ga ? ga.cat : "i11", cb = gb ? gb.cat : "i11";
    if (ca !== cb) return ca.localeCompare(cb, "en", { numeric: true });
    return L(ga || {}, lang).localeCompare(L(gb || {}, lang), lang);
  });
  const names = Object.keys(S.shop).map(function (id) {
    const r = recipeById(id);
    return r ? L(r.n, lang) + " (" + fmtNum(S.shop[id]) + ")" : "";
  }).filter(Boolean).join(" · ");

  let rows = "";
  let lastCat = null;
  keys.forEach(function (id) {
    const T2 = totals[id], g = ingById(id);
    if (g && g.cat !== lastCat) {
      lastCat = g.cat;
      const ic = ICATS.filter(function (c) { return c.id === g.cat; })[0];
      rows += '<tr><td class="b"></td><td colspan="2" style="padding-top:3mm"><b>' + esc(ic ? L(ic, lang) : "") + "</b></td></tr>";
    }
    const qty = T2.amount > 0 ? qtyLabel(T2.amount, baseUnitFor(T2.target), lang) : esc(t("qs", lang));
    rows += "<tr><td class=\"b\">☐</td><td>" + esc(g ? L(g, lang) : id) + '</td><td class="q">' + qty + "</td></tr>";
  });

  const el = $("#print");
  el.setAttribute("dir", RTL[lang] ? "rtl" : "ltr");
  el.setAttribute("lang", lang);
  el.innerHTML =
    '<div class="p-head"><span class="p-brand">Siham <span>Délice de Fès</span></span>' +
      '<span class="p-cat">' + esc(t("shop_title", lang)) + "</span></div>" +
    "<h1>" + esc(t("shop_title", lang)) + "</h1>" +
    '<p style="margin:0 0 6mm;color:#666">' + esc(names) + "</p>" +
    '<table class="p-sl">' + rows + "</table>" +
    '<div class="p-foot"><span>Siham Délice de Fès</span><span>' + esc(today()) + "</span></div>";
  setTimeout(function () { window.print(); }, 80);
}

/* ---------- exports ---------- */
function csv(rows) {
  return "﻿" + rows.map(function (r) {
    return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(";");
  }).join("\r\n");
}
async function saveFile(name, data) {
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data: data }); toast(t("export_done")); return; }
    catch (e) { if (e && e.code === "declined") return; }
  }
  try {
    const b = new Blob([data], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    toast(t("export_done"));
  } catch (e) { toast(t("err_save")); }
}
function exportRecipesCsv() {
  const rows = [["ID_Recette", "Nom_AR", "Nom_FR", "Nom_EN", "Categorie", "Sous_Categorie_FR",
    "Portions_Base", "Rendement", "Unite_Rendement", "Temps_Prep_min", "Temps_Repos_min",
    "Temps_Cuisson_min", "Temps_Congelation_min", "Difficulte", "Groupe", "ID_Ingredient",
    "Ingredient_AR", "Ingredient_FR", "Ingredient_EN", "Quantite", "Unite", "Mode_Echelle",
    "Optionnel", "Remarque_FR", "Date_Creation", "Date_Modification"]];
  S.recipes.forEach(function (r) {
    const c = catById(r.cat);
    (r.ings.length ? r.ings : [null]).forEach(function (it) {
      const g = it ? ingById(it.i) : null;
      rows.push([r.id, r.n.ar, r.n.fr, r.n.en, c ? c.fr : "", L(r.sub, "fr"),
        r.portions, r.yieldQ || "", r.yieldU || "", r.prep, r.rest, r.cook, r.freeze, r.diff,
        it ? L(GROUPS[it.g] || {}, "fr") : "", it ? it.i : "",
        g ? g.ar : "", g ? g.fr : "", g ? g.en : "",
        it ? it.q : "", it ? L(unitById(it.u), "fr") : "", it ? it.m : "",
        it && it.opt ? "oui" : "", it && it.rk ? L(it.rk, "fr") : "",
        r.created || "", r.modified || ""]);
    });
  });
  saveFile("recettes.csv", csv(rows));
}
function exportStepsCsv() {
  const rows = [["ID_Recette", "Nom_FR", "Numero", "Texte_AR", "Texte_FR", "Texte_EN"]];
  S.recipes.forEach(function (r) {
    r.steps.forEach(function (st, i) { rows.push([r.id, r.n.fr, i + 1, st.ar, st.fr, st.en]); });
    if (L(r.tips, "fr") || L(r.tips, "ar")) rows.push([r.id, r.n.fr, "conseil", r.tips.ar, r.tips.fr, r.tips.en]);
  });
  saveFile("etapes.csv", csv(rows));
}
function exportIngCsv() {
  const rows = [["ID_Ingredient", "Nom_AR", "Nom_FR", "Nom_EN", "Categorie_FR", "Unite_Habituelle",
    "Densite_g_par_ml", "Stock", "Unite_Stock"]];
  S.ings.forEach(function (g) {
    const ic = ICATS.filter(function (c) { return c.id === g.cat; })[0];
    const st = S.stock[g.id];
    rows.push([g.id, g.ar, g.fr, g.en, ic ? ic.fr : "", L(unitById(g.unit), "fr"),
      g.dens || "", st ? st.q : "", st ? L(unitById(st.u), "fr") : ""]);
  });
  saveFile("ingredients.csv", csv(rows));
}
function exportShopCsv() {
  const lang = S.lang;
  const totals = shoppingTotals();
  const rows = [["Categorie", "Ingredient", "Quantite", "Unite"]];
  Object.keys(totals).forEach(function (id) {
    const T2 = totals[id], g = ingById(id);
    const ic = g ? ICATS.filter(function (c) { return c.id === g.cat; })[0] : null;
    const r = T2.amount > 0 ? readable(T2.amount, baseUnitFor(T2.target)) : null;
    rows.push([ic ? L(ic, lang) : "", g ? L(g, lang) : id,
      r ? fmtNum(r.q) : t("qs", lang), r ? L(unitById(r.u), lang) : ""]);
  });
  saveFile("liste-de-courses.csv", csv(rows));
}
function exportJson() {
  const photos = {};
  S.recipes.forEach(function (r) { const d = readCachedPhoto(r.id); if (d) photos[r.id] = d; });
  saveFile("siham-delice-sauvegarde.json", JSON.stringify({
    app: "Siham Délice de Fès", version: 1, date: today(),
    ings: S.ings, recipes: S.recipes, stock: S.stock, shop: S.shop, photos: photos
  }));
}
function importJson(file) {
  const fr = new FileReader();
  fr.onload = async function () {
    let d;
    try { d = JSON.parse(fr.result); } catch (e) { toast(t("err_save")); return; }
    if (!d || !Array.isArray(d.recipes)) { toast(t("err_save")); return; }
    S.ings = Array.isArray(d.ings) && d.ings.length ? d.ings : S.ings;
    S.recipes = d.recipes;
    S.stock = d.stock || {};
    S.shop = d.shop || {};
    _idx.clear();
    saveLocal();
    if (S.db) {
      await pushIngs(); await pushStock(); await pushShop();
      for (const r of S.recipes) await pushRecipe(r);
      if (d.photos) for (const id of Object.keys(d.photos)) {
        cachePhoto(id, d.photos[id]);
        await dbWrite("photos/" + id, { d: d.photos[id] });
      }
    } else if (d.photos) {
      Object.keys(d.photos).forEach(function (id) { cachePhoto(id, d.photos[id]); });
    }
    toast(t("import_done"));
    S.screen = "home"; render();
  };
  fr.readAsText(file);
}
</script>

<script>
"use strict";

/* =====================================================================
   Illustrations de secours — un motif dessine par recette, tant qu'aucune
   photo n'a ete ajoutee. Fond bitonal fixe : lisible en theme clair
   comme en theme sombre. Une vraie photo prend toujours le dessus.
   ===================================================================== */

const CREAM = "#F2E9D6";
const INK_SOFT = "#00000030";
const INK_MID = "#00000042";

/* Forme du motif, deduite du nom de la recette dans les trois langues.
   La premiere regle qui correspond gagne : l'ordre compte. */
const SHAPE_RULES = [
  ["rosette",  /chebakia|شباكي/],
  ["dome",     /ghriba|ghoriba|غريب/],
  ["crescent", /gazelle|kaab|كعب الغزال/],
  ["slice",    /fekkas|فقاص/],
  ["triangle", /briouat|بريوات/],
  ["spiral",   /mhencha|محنش/],
  ["ring",     /sfenj|kaak|سفنج|كعك/],
  ["lozenge",  /makrout|مقروط/],
  ["nest",     /krichlat|krioch|rziza|كريوش|رزيزة/],
  ["square",   /msemen|meloui|rghaif|مسمن|ملوي|رغايف/],
  ["pancake",  /baghrir|بغرير/],
  ["disc",     /harcha|حرشة/],
  ["mound",    /sellou|sfouf|zammita|سلو|سفوف|زميط/],
  ["layers",   /pastilla|ktefa|jawhara|bouchnikha|بسطيل|كتفا|جوهرة|بوشنيخ/],
  ["tajine",   /tajine|طاجين|tanjia|طنجية/],
  ["couscous", /couscous|كسكس|seffa|سفة|medfouna|مدفونة/],
  ["bowl",     /harira|حريرة|soupe|شوربة|chorba|bissara|بيصارة|بصارة/],
  ["salad",    /salade|سلطة|zaalouk|زعلوك|taktouka|تكتوكة/],
  ["bread",    /khobz|خبز|batbout|بطبوط|pain|رفيسة|rfissa/],
  ["flan",     /panna cotta|br(û|u)l(é|e)e|بانا كوتا|بروليه/],

    sugar: sugar, matur: matur, churn: churn
  };
}

  [["افرك السميد بالزبدة المذابة ودعه يرتاح نصف ساعة.", "Sablez la semoule avec le beurre fondu et laissez reposer une demi-heure.", "Rub the semolina with the melted butter and rest half an hour."],

   ["اقلها حتى تذهب ثم اغمرها في العسل الدافئ.", "Faites frire jusqu'à coloration puis plongez dans le miel tiède.", "Fry until golden, then dip in warm honey."]],

R("RCP-039", "c4", 2, 8, [40, 30, 20, 0], 40, "pc",

  [["اعجن الدقيق مع البيض والسكر والزيت والخميرة والملح وماء الزهر.", "Pétrissez la farine avec les œufs, le sucre, l'huile, la levure, le sel et l'eau de fleur d'oranger.", "Knead the flour with eggs, sugar, oil, baking powder, salt and orange blossom water."],
   ["دع العجين يرتاح نصف ساعة.", "Laissez reposer une demi-heure.", "Rest for half an hour."],

   ["اقلها في زيت متوسط حتى تذهب.", "Faites frire à feu moyen jusqu'à coloration.", "Fry over medium heat until golden."],
   ["اغمرها في العسل الدافئ ورشها بالسمسم.", "Plongez-les dans le miel tiède et parsemez de sésame.", "Dip in warm honey and scatter sesame."]],

  [["اخلط الدقيق والسميد والملح والخميرة، ثم اعجن بالماء الفاتر حتى تحصل على عجين لين جدا.", "Mélangez farine, semoule, sel et levure, puis pétrissez à l'eau tiède jusqu'à une pâte très souple.", "Mix flour, semolina, salt and yeast, then knead with warm water to a very soft dough."],

   ["افرد كل كرة بيديك على سطح مدهون حتى تصبح شفافة، رشها بالزبدة والسميد ثم اطوها مربعا.", "Étalez chaque boule à la main sur un plan huilé jusqu'à transparence, parsemez de beurre et de semoule, pliez en carré.", "Spread each ball by hand on an oiled surface until translucent, dot with butter and semolina, fold into a square."],

  ["العجين اللين هو السر: إن كان متماسكا لن ينفرد رقيقا.", "La souplesse de la pâte fait tout : trop ferme, elle ne s'étalera jamais assez fin.", "The softness of the dough is everything: too firm and it will never stretch thin enough."]);

R("RCP-047", "c2", 2, 6, [40, 20, 25, 0], 12, "pc",
  ["مسمن بالعسل", "Msemen au miel", "Honey Msemen"],
  ["يقدم دافئا بالعسل", "Servi tiède au miel", "Served warm with honey"],
  "msemen miel beurre",
  [["farine", 500, "g"], ["semoule_f", 150, "g"], ["sel", 8, "g", "pate", "root"],
   ["levure_b", 5, "g", "pate", "root"], ["eau", 350, "ml"],
   ["huile", 150, "ml", "friture", "fix"], ["beurre_f", 80, "g", "friture"], ["semoule_f", 100, "g", "friture"],
   ["miel", 250, "g", "sirop"], ["beurre_f", 60, "g", "sirop"]],
  [["حضر عجين المسمن واتركه يرتاح عشرين دقيقة.", "Préparez la pâte à msemen et laissez-la reposer vingt minutes.", "Make the msemen dough and rest it twenty minutes."],
   ["افرد الكرات رقيقة، ادهنها بالزبدة والسميد واطوها مربعات.", "Étalez finement, beurrez, saupoudrez de semoule et pliez en carrés.", "Stretch thin, butter, dust with semolina and fold into squares."],
   ["اطبخها في مقلاة على الوجهين.", "Cuisez à la poêle des deux côtés.", "Cook in a pan on both sides."],
   ["أذب العسل مع الزبدة على نار هادئة.", "Faites fondre le miel avec le beurre à feu doux.", "Melt the honey with the butter over low heat."],
   ["اغمس المسمن الساخن في الخليط وقدمه فورا.", "Trempez les msemen chauds dans le mélange et servez aussitôt.", "Dip the hot msemen in the mixture and serve at once."]],
  ["اغمسه ساخنا: باردا لا يمتص العسل.", "Trempez-les chauds : froids, ils n'absorbent plus le miel.", "Dip them hot: cold, they no longer drink the honey."]);

R("RCP-048", "c2", 3, 6, [55, 20, 30, 0], 12, "pc",
  ["مسمن معمر", "Msemen farci", "Stuffed Msemen"],
  ["بالبصل والطماطم", "À l'oignon et à la tomate", "With onion and tomato"],
  "msemen farci maamar",
  [["farine", 500, "g"], ["semoule_f", 150, "g"], ["sel", 8, "g", "pate", "root"],
   ["levure_b", 5, "g", "pate", "root"], ["eau", 350, "ml"],
   ["huile", 150, "ml", "friture", "fix"], ["beurre_f", 80, "g", "friture"], ["semoule_f", 100, "g", "friture"],
   ["huile_oli", 40, "ml", "farce"], ["sel", 4, "g", "farce", "root"]],
  [["حضر عجين المسمن ودعه يرتاح.", "Préparez la pâte à msemen et laissez-la reposer.", "Make the msemen dough and let it rest."],
   ["حضر الحشوة المختارة: بصل مقلي، طماطم، أو أعشاب، واتركها تبرد تماما.", "Préparez la farce de votre choix — oignon revenu, tomate, herbes — et laissez-la refroidir.", "Prepare your chosen filling — softened onion, tomato, herbs — and let it cool."],
   ["افرد كل كرة رقيقة جدا، وزع الحشوة في الوسط.", "Étalez chaque boule très finement et répartissez la farce au centre.", "Stretch each ball very thin and spread the filling in the middle."],
   ["اطو الأطراف الأربعة على الحشوة لتكوين مربع محكم.", "Repliez les quatre bords sur la farce pour former un carré bien fermé.", "Fold the four edges over the filling into a sealed square."],
   ["اطبخها على نار متوسطة حتى تنضج الحشوة والعجين معا.", "Cuisez à feu moyen pour que la farce et la pâte cuisent ensemble.", "Cook over medium heat so filling and dough cook together."]],
  ["الحشوة الباردة والجافة فقط: الرطبة تمزق العجين.", "Une farce froide et sèche, jamais humide : elle déchirerait la pâte.", "A cold, dry filling only: a wet one tears the dough."]);

R("RCP-049", "c2", 2, 6, [40, 20, 25, 0], 12, "pc",
  ["الملوي", "Meloui", "Moroccan Meloui"],
  ["حلزوني ومورق", "Roulé en escargot", "Rolled into a coil"],
  "meloui melwi escargot",
  [["farine", 500, "g"], ["semoule_f", 150, "g"], ["sel", 8, "g", "pate", "root"],
   ["levure_b", 5, "g", "pate", "root"], ["eau", 350, "ml"],
   ["huile", 150, "ml", "friture", "fix"], ["beurre_f", 80, "g", "friture"]],
  [["حضر عجين المسمن نفسه ودعه يرتاح عشرين دقيقة.", "Préparez la même pâte que le msemen et laissez reposer vingt minutes.", "Make the same dough as msemen and rest twenty minutes."],
   ["افرد كل كرة رقيقة على سطح مدهون.", "Étalez chaque boule finement sur un plan huilé.", "Stretch each ball thin on an oiled surface."],
   ["ادهنها بالزبدة ثم لفها كحبل طويل رفيع.", "Beurrez puis roulez en un long cordon fin.", "Butter, then roll into a long thin rope."],
   ["لف الحبل على نفسه كالحلزون واتركه يرتاح خمس دقائق.", "Enroulez le cordon en escargot et laissez détendre cinq minutes.", "Coil the rope into a snail and let it relax five minutes."],
   ["اضغطه براحة اليد ليصبح قرصا واطبخه في مقلاة على الوجهين.", "Aplatissez à la paume en galette et cuisez à la poêle des deux côtés.", "Press flat with your palm and cook in a pan on both sides."]],
  ["الراحة بعد اللف تمنع القرص من الانكماش عند الضغط.", "Le repos après l'enroulage empêche la galette de se rétracter.", "The rest after coiling stops the round from shrinking back."]);

R("RCP-050", "c2", 2, 6, [45, 20, 25, 0], 14, "pc",
  ["الرغايف", "Rghaif", "Moroccan Rghaif"],
  ["طبقات لا تحصى", "Feuilletage infini", "Endless layers"],
  "rghaif feuilleté",
  [["farine", 600, "g"], ["semoule_f", 100, "g"], ["sel", 8, "g", "pate", "root"],
   ["levure_b", 4, "g", "pate", "root"], ["eau", 400, "ml"],
   ["huile", 180, "ml", "friture", "fix"], ["beurre_f", 100, "g", "friture"], ["semoule_f", 80, "g", "friture"]],
  [["اعجن الدقيق والسميد والملح والخميرة بالماء الفاتر حتى يلين العجين.", "Pétrissez farine, semoule, sel et levure à l'eau tiède jusqu'à ce que la pâte s'assouplisse.", "Knead flour, semolina, salt and yeast with warm water until the dough softens."],
   ["اعجنه طويلا ثم دعه يرتاح عشرين دقيقة تحت الزيت.", "Pétrissez longuement puis laissez reposer vingt minutes sous l'huile.", "Knead at length, then rest twenty minutes under oil."],
   ["افرد كل كرة حتى الشفافية ثم ادهنها بالزبدة والسميد.", "Étalez chaque boule jusqu'à transparence puis beurrez et saupoudrez de semoule.", "Stretch each ball to transparency, then butter and dust with semolina."],
   ["اطو من الجانبين ثم من الأعلى والأسفل، وكرر الطي مرتين.", "Repliez les côtés puis le haut et le bas, et recommencez deux fois.", "Fold in the sides, then top and bottom, and repeat twice."],
   ["اطبخها في مقلاة ساخنة حتى تتفصل الطبقات.", "Cuisez à la poêle chaude jusqu'à ce que les feuilles se détachent.", "Cook in a hot pan until the layers separate."]],
  ["كل طية إضافية طبقة إضافية: ثلاث طيات هي الحد المعقول.", "Chaque pliage supplémentaire est une couche de plus : trois est la limite raisonnable.", "Each extra fold is another layer: three is the sensible limit."]);

R("RCP-051", "c2", 2, 6, [20, 60, 20, 0], 20, "pc",
  ["البغرير", "Baghrir", "Moroccan Baghrir"],
  ["ألف ثقب وثقب", "Aux mille trous", "The thousand-hole pancake"],
  "baghrir crêpe mille trous",
  [["semoule_f", 350, "g"], ["farine", 100, "g"], ["levure_b", 10, "g", "pate", "root"],
   ["levure_c", 5, "g", "pate", "root"], ["sel", 5, "g", "pate", "root"], ["sucre", 20, "g"],
   ["eau", 900, "ml"], ["miel", 200, "g", "sirop"], ["beurre_f", 80, "g", "sirop"]],
  [["اخلط السميد والدقيق والخميرتين والملح والسكر في الخلاط.", "Mixez la semoule, la farine, les levures, le sel et le sucre au blender.", "Blend the semolina, flour, both leaveners, salt and sugar."],
   ["أضف الماء الفاتر تدريجيا واخلط ثلاث دقائق حتى يصبح المزيج سائلا وناعما.", "Ajoutez l'eau tiède peu à peu et mixez trois minutes jusqu'à une pâte liquide et lisse.", "Add the warm water gradually and blend three minutes to a smooth, pourable batter."],
   ["غط المزيج ودعه يختمر ساعة حتى تظهر الفقاعات على السطح.", "Couvrez et laissez lever une heure, jusqu'à ce que des bulles apparaissent en surface.", "Cover and prove one hour, until bubbles show on the surface."],
   ["اسكب مغرفة في مقلاة ساخنة غير لاصقة دون دهن، ولا تقلبها.", "Versez une louche dans une poêle antiadhésive chaude et sèche, sans retourner.", "Pour a ladle into a hot dry non-stick pan, and never turn it."],
   ["اطبخها حتى تجف تماما من الأعلى، ثم قدمها بالعسل والزبدة.", "Cuisez jusqu'à ce que le dessus soit entièrement sec, servez au miel et au beurre.", "Cook until the top is completely dry, and serve with honey and butter."]],
  ["إن لم تظهر الثقوب فالمزيج ثخين: أضف قليلا من الماء وأعد الخلط.", "Si les trous ne viennent pas, la pâte est trop épaisse : ajoutez un peu d'eau et remixez.", "If the holes do not come, the batter is too thick: add a little water and blend again."]);

R("RCP-052", "c2", 1, 6, [15, 15, 20, 0], 10, "pc",
  ["حرشة", "Harcha", "Moroccan Harcha"],
  ["قرص السميد", "La galette de semoule", "The semolina griddle cake"],
  "harcha semoule galette",
  [["semoule_m", 500, "g"], ["beurre_f", 150, "g"], ["sucre", 60, "g"], ["lait", 200, "ml"],
   ["levure_c", 10, "g", "pate", "root"], ["sel", 5, "g", "pate", "root"], ["semoule_f", 60, "g", "decor"]],
  [["افرك السميد بالزبدة المذابة بين راحتي اليد حتى يتشرب.", "Sablez la semoule avec le beurre fondu entre les paumes jusqu'à absorption.", "Rub the semolina with the melted butter between your palms until absorbed."],
   ["أضف السكر والملح والخميرة.", "Ajoutez le sucre, le sel et la levure.", "Add the sugar, salt and baking powder."],
   ["اسكب الحليب تدريجيا حتى تتماسك العجينة دون أن تلتصق.", "Versez le lait peu à peu jusqu'à ce que la pâte tienne sans coller.", "Pour in the milk gradually until the dough holds without sticking."],
   ["دعها ترتاح ربع ساعة ثم شكل أقراصا سميكة ومررها في السميد الرقيق.", "Laissez reposer un quart d'heure, formez des galettes épaisses et passez-les dans la semoule fine.", "Rest a quarter of an hour, shape thick rounds and coat them in fine semolina."],
   ["اطبخها في مقلاة على نار هادئة عشر دقائق لكل وجه.", "Cuisez à la poêle à feu doux, dix minutes par face.", "Cook in a pan over low heat, ten minutes each side."]],
  ["نار هادئة وطويلة: الحرارة القوية تحرق السطح ويبقى القلب نيئا.", "Feu doux et longue cuisson : à feu vif, la surface brûle et le cœur reste cru.", "Low heat and long cooking: high heat burns the crust and leaves the centre raw."]);

R("RCP-053", "c2", 1, 6, [15, 15, 20, 0], 10, "pc",
  ["حرشة بالعسل", "Harcha au miel", "Honey Harcha"],
  ["ساخنة بالعسل والزبدة", "Chaude, au miel et au beurre", "Hot, with honey and butter"],
  "harcha miel",
  [["semoule_m", 500, "g"], ["beurre_f", 150, "g"], ["sucre", 50, "g"], ["lait", 200, "ml"],
   ["levure_c", 10, "g", "pate", "root"], ["sel", 5, "g", "pate", "root"],
   ["miel", 220, "g", "sirop"], ["beurre_f", 60, "g", "sirop"]],
  [["افرك السميد بالزبدة ثم أضف السكر والملح والخميرة.", "Sablez la semoule au beurre, puis ajoutez sucre, sel et levure.", "Rub the semolina with butter, then add sugar, salt and baking powder."],
   ["أضف الحليب حتى تتماسك العجينة ودعها ترتاح.", "Ajoutez le lait jusqu'à cohésion et laissez reposer.", "Add the milk until it comes together and rest."],
   ["شكل أقراصا واطبخها على نار هادئة على الوجهين.", "Formez des galettes et cuisez-les à feu doux des deux côtés.", "Shape rounds and cook them over low heat on both sides."],
   ["أذب العسل مع الزبدة.", "Faites fondre le miel avec le beurre.", "Melt the honey with the butter."],
   ["اشقق الحرشة وهي ساخنة واسكب فيها الخليط.", "Fendez les harcha chaudes et versez-y le mélange.", "Split the hot harcha and pour the mixture inside."]],
  ["شقها من الجانب لا من الأعلى: العسل يبقى في الداخل.", "Fendez-les sur le côté et non sur le dessus : le miel reste dedans.", "Split them at the side, not the top: the honey stays inside."]);

R("RCP-054", "c2", 3, 6, [60, 30, 25, 0], 10, "pc",
  ["رزيزة", "Rziza", "Moroccan Rziza"],
  ["خيوط رفيعة كالعش", "Fins fils en nid", "Fine threads in a nest"],
  "rziza fils nid",
  [["farine", 400, "g"], ["semoule_f", 100, "g"], ["sel", 5, "g", "pate", "root"], ["eau", 250, "ml"],
   ["huile", 100, "ml", "friture", "fix"], ["beurre_f", 80, "g", "sirop"], ["miel", 250, "g", "sirop"]],
  [["اعجن الدقيق والسميد والملح بالماء حتى تحصل على عجين لين جدا، ودعه يرتاح نصف ساعة.", "Pétrissez farine, semoule et sel à l'eau jusqu'à une pâte très souple, puis laissez reposer une demi-heure.", "Knead flour, semolina and salt with water into a very soft dough, then rest half an hour."],
   ["افرد كرة رقيقة جدا على سطح مدهون بالزيت.", "Étalez une boule très finement sur un plan huilé.", "Stretch a ball very thin on an oiled surface."],
   ["قص العجين المفرود إلى خيوط رفيعة جدا بسكين.", "Découpez la feuille en fils très fins au couteau.", "Cut the sheet into very fine threads with a knife."],
   ["اجمع الخيوط برفق على شكل عش دون ضغطها، وكرر مع بقية الكرات.", "Rassemblez les fils délicatement en nid, sans les tasser, et recommencez.", "Gather the threads gently into a nest without packing them, and repeat."],
   ["اطبخها في مقلاة أو على البخار، ثم قدمها بالعسل والزبدة.", "Cuisez à la poêle ou à la vapeur, servez au miel et au beurre.", "Cook in a pan or by steaming, and serve with honey and butter."]],
  ["لا تضغط العش: هشاشته هي كل جمال الرزيزة.", "Ne tassez pas le nid : sa légèreté fait toute la rziza.", "Do not pack the nest: its airiness is the whole point of rziza."]);

R("RCP-055", "c2", 2, 6, [20, 90, 20, 0], 15, "pc",
  ["السفنج", "Sfenj", "Moroccan Sfenj"],
  ["حلقات مقلية", "Beignets en anneaux", "Ring doughnuts"],
  "sfenj beignet anneau",
  [["farine", 600, "g"], ["levure_b", 12, "g", "pate", "root"], ["sel", 10, "g", "pate", "root"],
   ["eau", 450, "ml"], ["huile_fri", 1000, "ml", "friture", "fix"], ["sucre", 60, "g", "decor", "lin", true]],
  [["أذب الخميرة في قليل من الماء الفاتر.", "Délayez la levure dans un peu d'eau tiède.", "Dissolve the yeast in a little warm water."],
   ["اعجن الدقيق والملح بالماء والخميرة عشر دقائق حتى يصبح العجين لزجا ومرنا.", "Pétrissez la farine et le sel avec l'eau et la levure dix minutes, jusqu'à une pâte collante et élastique.", "Knead the flour and salt with the water and yeast for ten minutes, to a sticky elastic dough."],
   ["غط العجين ودعه يتضاعف ساعة ونصف.", "Couvrez et laissez doubler une heure et demie.", "Cover and let it double for an hour and a half."],
   ["بلل يديك، خذ قطعة من العجين، اثقبها بالإصبع ووسع الثقب.", "Mouillez-vous les mains, prélevez un morceau, percez-le du doigt et élargissez le trou.", "Wet your hands, take a piece, pierce it with a finger and widen the hole."],
   ["اقلها في زيت غزير وساخن حتى تذهب على الوجهين.", "Faites frire dans un bain d'huile bien chaud, dorés des deux côtés.", "Fry in plenty of hot oil, golden on both sides."]],
  ["العجين لزج عمدا: لا تضف دقيقا، بلل يديك بدل ذلك.", "La pâte colle volontairement : n'ajoutez pas de farine, mouillez-vous les mains.", "The dough is meant to be sticky: add no flour, wet your hands instead."]);

R("RCP-056", "c2", 2, 6, [20, 90, 20, 0], 15, "pc",
  ["السفنج بالعسل", "Sfenj au miel", "Honey Sfenj"],
  ["مغموس في العسل", "Trempés dans le miel", "Dipped in honey"],
  "sfenj miel beignet",
  [["farine", 600, "g"], ["levure_b", 12, "g", "pate", "root"], ["sel", 10, "g", "pate", "root"],
   ["eau", 450, "ml"], ["huile_fri", 1000, "ml", "friture", "fix"],
   ["miel", 400, "g", "sirop"], ["eau_zhar", 20, "ml", "sirop", "fix"]],
  [["حضر عجين السفنج ودعه يختمر ساعة ونصف.", "Préparez la pâte à sfenj et laissez-la lever une heure et demie.", "Make the sfenj dough and let it rise an hour and a half."],
   ["شكل الحلقات بأصابع مبللة.", "Formez les anneaux avec des doigts mouillés.", "Shape the rings with wet fingers."],
   ["اقلها في زيت ساخن حتى تذهب.", "Faites-les frire dans l'huile chaude jusqu'à coloration.", "Fry them in hot oil until golden."],
   ["سخن العسل مع ماء الزهر دون أن يغلي.", "Chauffez le miel avec l'eau de fleur d'oranger sans le faire bouillir.", "Warm the honey with the orange blossom water without boiling."],
   ["اغمس السفنج الساخن في العسل وقدمه فورا.", "Trempez les sfenj chauds dans le miel et servez aussitôt.", "Dip the hot sfenj in the honey and serve at once."]],
  ["السفنج يؤكل في الساعة التي يقلى فيها: لا يحفظ.", "Le sfenj se mange dans l'heure : il ne se conserve pas.", "Sfenj is eaten within the hour: it does not keep."]);

R("RCP-057", "c2", 2, 6, [25, 60, 20, 0], 20, "pc",
  ["بغرير باللوز", "Baghrir aux amandes", "Almond Baghrir"],
  ["بالعسل واللوز المحمص", "Miel et amandes grillées", "Honey and toasted almonds"],
  "baghrir amande miel",
  [["semoule_f", 350, "g"], ["farine", 100, "g"], ["levure_b", 10, "g", "pate", "root"],
   ["levure_c", 5, "g", "pate", "root"], ["sel", 5, "g", "pate", "root"], ["sucre", 20, "g"], ["eau", 900, "ml"],
   ["miel", 200, "g", "sirop"], ["beurre_f", 60, "g", "sirop"], ["amande_m", 80, "g", "decor"]],
  [["اخلط مكونات البغرير في الخلاط حتى يصبح المزيج ناعما.", "Mixez les ingrédients du baghrir jusqu'à une pâte lisse.", "Blend the baghrir ingredients to a smooth batter."],
   ["دع المزيج يختمر ساعة.", "Laissez lever une heure.", "Let it prove for one hour."],
   ["اطبخ البغرير على وجه واحد حتى تنفتح الثقوب ويجف السطح.", "Cuisez les baghrir sur une seule face jusqu'à ce que les trous s'ouvrent et que le dessus sèche.", "Cook the baghrir on one side only until the holes open and the top dries."],
   ["حمص اللوز المقشر في مقلاة جافة.", "Grillez les amandes effilées à sec.", "Toast the flaked almonds in a dry pan."],
   ["اسكب العسل والزبدة على البغرير الساخن ورشه باللوز.", "Nappez les baghrir chauds de miel et de beurre, parsemez d'amandes.", "Pour honey and butter over the hot baghrir and scatter the almonds."]],
  ["ضع اللوز في اللحظة الأخيرة: يفقد قرمشته في العسل.", "Ajoutez les amandes au dernier moment : le miel les ramollit.", "Add the almonds at the last moment: honey softens them."]);

R("RCP-058", "c2", 2, 6, [25, 60, 20, 0], 20, "pc",
  ["بغرير بالشوكولاتة", "Baghrir au chocolat", "Chocolate Baghrir"],
  ["يحبه الأطفال", "Le préféré des enfants", "The children's favourite"],

  [["اخفق الزبدة مع السكر حتى يفتح اللون، ثم أضف البيض واحدة واحدة.", "Crémez le beurre et le sucre, puis ajoutez les œufs un à un.", "Cream the butter and sugar, then add the eggs one at a time."],
   ["أضف الدقيق والخميرة والملح والحليب.", "Incorporez la farine, la levure, le sel et le lait.", "Fold in the flour, baking powder, salt and milk."],
   ["قسم المزيج نصفين: عطر الأول بالفانيليا والثاني بالكاكاو.", "Divisez l'appareil en deux : vanille dans l'un, cacao dans l'autre.", "Split the batter in two: vanilla in one, cocoa in the other."],
   ["اسكبهما بالتناوب في القالب ومرر سكينا مرة واحدة على شكل حرف S.", "Versez-les en alternance et passez la lame une seule fois en S.", "Pour them alternately and draw a knife through once, in an S."],

  ["مرة واحدة بالسكين: التحريك الزائد يمزج اللونين ويلغي الرخام.", "Un seul passage de lame : trop remuer mélange les deux et supprime le marbré.", "One pass of the knife: stirring more blends the two and kills the marbling."]);

  [["سخن العسل مع الحليب حتى يصبح سائلا، دون غليان.", "Chauffez le miel avec le lait jusqu'à fluidité, sans bouillir.", "Warm the honey with the milk until fluid, without boiling."],
   ["اخفق البيض ثم أضف الزبدة المذابة وخليط العسل الفاتر.", "Fouettez les œufs, ajoutez le beurre fondu et le mélange miel-lait tiède.", "Whisk the eggs, add the melted butter and the warm honey-milk."],

   ["اسكب في قالب مبطن واخبزه 40 دقيقة على 160 درجة.", "Versez dans un moule chemisé et enfournez 40 minutes à 160 °C.", "Pour into a lined tin and bake 40 minutes at 160 °C."],
   ["اتركه يبرد يوما كاملا قبل التقطيع.", "Laissez-le reposer une journée entière avant de le trancher.", "Let it rest a full day before slicing."]],

  [["اطحن البسكويت واخلطه بالزبدة المذابة، ثم اضغطه في قاع القالب.", "Mixez les biscuits avec le beurre fondu et tassez au fond du moule.", "Blitz the biscuits with the melted butter and press into the base of the tin."],

   ["أضف البيض واحدة واحدة، ثم الكريمة والنشا والفانيليا والليمون.", "Ajoutez les œufs un à un, puis la crème, la maïzena, la vanille et le citron.", "Add the eggs one at a time, then the cream, cornstarch, vanilla and lemon."],
   ["اسكب على القاعدة واخبزه 50 دقيقة على 150 درجة في حمام مائي.", "Versez sur la base et enfournez 50 minutes à 150 °C au bain-marie.", "Pour over the base and bake 50 minutes at 150 °C in a water bath."],
   ["أطفئ الفرن ودعه يبرد بداخله، ثم برده أربع ساعات.", "Éteignez le four, laissez-y refroidir, puis réservez quatre heures au frais.", "Turn off the oven, cool it inside, then chill four hours."]],
  ["التشقق يأتي من الهواء المخفوق ومن التبريد المفاجئ: تجنب الاثنين.", "Les fissures viennent de l'air battu et du choc thermique : évitez les deux.", "Cracks come from beaten-in air and thermal shock: avoid both."]);

const S_PULPE = ["لب الفاكهة", "Pulpe de fruit", "Fruit pulp"];

function SORBET(id, n, sub, kw, fruit, fruitQ, sucre, eau, cit, sugarPct, flav, extra) {
  const fu = (ING_SEED.filter(function (g) { return g.id === fruit; })[0] || { unit: "g" }).unit;
  const ings = [[fruit, fruitQ, fu, "base"], ["sucre", sucre, "g", "base"], ["eau", eau, "ml", "base"],
    ["jus_cit", cit, "ml", "base"], ["glucose", 25, "g", "base"], ["stabilisant", 2, "g", "base"]];
  if (extra) ings.push(extra);
  R(id, "c7", 1, 6, [20, 240, 5, 240], 750, "ml", n, sub, kw, ings,
    [["اغل الماء مع السكر والغلوكوز دقيقتين ثم اتركه يبرد تماما.",
      "Portez l'eau, le sucre et le glucose à ébullition deux minutes, puis laissez refroidir complètement.",
      "Boil the water, sugar and glucose for two minutes, then cool completely."],
     ["اهرس الفاكهة حتى تصبح ناعمة، وصفها إن كانت ليفية أو بها بذور.",

      "Mix the pulp with the cold syrup, lemon juice and stabiliser."],

      "Laissez maturer quatre heures au réfrigérateur.",
      "Mature four hours in the fridge."],

      "Turbinez 20 à 25 minutes puis congelez deux heures avant de servir.",
      "Churn 20 to 25 minutes, then freeze two hours before serving."]],
    ["نسبة السكر " + sugarPct + " بالمائة ليست زينة: أقل منها يتجمد السوربيه كالحجر، وأكثر منها لا يتماسك.",

R("RCP-121", "c8", 1, 8, [20, 120, 10, 0], 700, "g",

   ["maizena", 45, "g", "base"], ["vanille_ex", 10, "ml", "base", "fix"], ["beurre", 30, "g", "base"]],
  [["سخن الحليب مع الفانيليا دون أن يغلي.", "Chauffez le lait avec la vanille, sans le faire bouillir.", "Heat the milk with the vanilla, without boiling."],
   ["اخفق الصفار مع السكر ثم أضف النشا.", "Fouettez les jaunes avec le sucre, puis ajoutez la maïzena.", "Whisk the yolks with the sugar, then add the cornstarch."],
   ["اسكب الحليب الساخن على الخليط، أعده إلى النار وحرك بلا توقف حتى يثخن، ثم اتركه يغلي دقيقة كاملة.", "Versez le lait chaud sur le mélange, remettez sur le feu et remuez sans arrêt jusqu'à épaississement, puis laissez bouillir une minute pleine.", "Pour the hot milk over the mix, return to the heat and stir without stopping until thick, then boil for a full minute."],
   ["أضف الزبدة خارج النار.", "Ajoutez le beurre hors du feu.", "Stir in the butter off the heat."],
   ["غطها بغشاء ملامس واتركها تبرد ساعتين.", "Filmez au contact et laissez refroidir deux heures.", "Cover with cling film touching the surface and chill two hours."]],
  ["دقيقة الغليان ليست اختيارية: بدونها يبقى للنشا طعم الدقيق النيء.", "La minute d'ébullition n'est pas facultative : sans elle, la maïzena garde son goût de farine.", "The full minute of boiling is not optional: without it the cornstarch keeps its raw taste."]);

  [["اشقق عود الفانيليا وسخنه مع الحليب والكريمة، ثم اتركه ينقع عشرين دقيقة.", "Fendez la gousse, chauffez-la avec le lait et la crème, puis laissez infuser vingt minutes.", "Split the pod, heat it with the milk and cream, then infuse twenty minutes."],

   ["سخن الكريمة مع العسل حتى الغليان الخفيف واسكبها على الشوكولاتة.", "Chauffez la crème avec le miel jusqu'au frémissement et versez-la sur le chocolat.", "Heat the cream with the honey to a simmer and pour it over the chocolate."],
   ["انتظر دقيقة كاملة دون تحريك، ثم اخلط من الوسط نحو الخارج بحركات دائرية صغيرة.", "Attendez une minute pleine sans remuer, puis lissez du centre vers l'extérieur par petits cercles.", "Wait a full minute without stirring, then stir from the centre outwards in small circles."],
   ["أضف الزبدة عندما تنزل حرارة الخليط إلى 40 درجة.", "Ajoutez le beurre quand le mélange descend à 40 °C.", "Add the butter once the mixture drops to 40 °C."]],
  ["الخلط من الوسط نحو الخارج هو ما يستحلب الغاناش ويجعله لامعا: التحريك العشوائي يتركه باهتا ومحببا.", "Lisser du centre vers l'extérieur est ce qui émulsionne la ganache et la fait briller : remuer au hasard la rend terne et granuleuse.", "Stirring from the centre outwards is what emulsifies the ganache and makes it shine: random stirring leaves it dull and grainy."]);

R("RCP-126", "c8", 1, 8, [10, 0, 0, 0], 550, "g",
  ["كريمة مخفوقة", "Crème chantilly", "Whipped Cream"],
  ["ثلاثة مكونات ومزلق واحد", "Trois ingrédients, un seul écueil", "Three ingredients, one pitfall"],
  "chantilly creme fouettee",
  [["creme", 500, "ml", "base"], ["sucre_glace", 50, "g", "base"],
   ["vanille_ex", 5, "ml", "base", "fix"]],
  [["ضع الكريمة والوعاء والمخفقة في الثلاجة نصف ساعة قبل البدء.", "Placez la crème, le bol et le fouet au réfrigérateur une demi-heure avant de commencer.", "Chill the cream, the bowl and the whisk for half an hour before starting."],
   ["اخفق بسرعة متوسطة، لا عالية.", "Fouettez à vitesse moyenne, pas rapide.", "Whip at medium speed, not high."],
   ["أضف السكر الناعم والفانيليا حين يبدأ الخليط في التماسك.", "Ajoutez le sucre glace et la vanille dès que la crème commence à prendre.", "Add the icing sugar and vanilla as soon as the cream starts to hold."],
   ["أوقف الخفق حين ترتسم آثار المخفقة وتبقى.", "Arrêtez dès que le fouet laisse des sillons qui tiennent.", "Stop the moment the whisk leaves furrows that hold."]],
  ["كريمة بنسبة دسم 30 بالمائة على الأقل: أقل من ذلك لا ترتفع أبدا، مهما فعلت.", "Une crème à 30 % de matière grasse au minimum : en dessous, elle ne monte pas, quoi que vous fassiez.", "Cream with at least 30 % fat: below that it will not whip, whatever you do."]);

R("RCP-127", "c8", 2, 8, [20, 120, 10, 0], 500, "g",
  ["كريمة الليمون", "Crème au citron", "Lemon Curd"],
  ["حادة، للتارت والكؤوس", "Vive, pour tartes et verrines", "Sharp, for tarts and glasses"],
  "lemon curd citron garniture",
  [["jus_cit", 150, "ml", "base"], ["zeste_cit", 12, "g", "base", "root"], ["sucre", 150, "g", "base"],
   ["oeuf", 3, "pc", "base"], ["beurre", 120, "g", "base"], ["maizena", 15, "g", "base"]],
  [["افرك القشر بالسكر بأصابعك لتحرير زيوته العطرية.", "Frottez le zeste dans le sucre du bout des doigts pour libérer ses huiles.", "Rub the zest into the sugar with your fingertips to release its oils."],
   ["اخفق البيض مع السكر المعطر والنشا وعصير الليمون.", "Fouettez les œufs avec ce sucre, la maïzena et le jus de citron.", "Whisk the eggs with that sugar, the cornstarch and the lemon juice."],
   ["اطبخ على نار هادئة مع التحريك المتواصل حتى يثخن المزيج.", "Cuisez à feu doux en remuant sans arrêt jusqu'à épaississement.", "Cook over low heat, stirring constantly, until thick."],
   ["أضف الزبدة قطعة قطعة خارج النار، ثم بردها ساعتين.", "Ajoutez le beurre morceau par morceau hors du feu, puis réservez deux heures au frais.", "Whisk in the butter piece by piece off the heat, then chill two hours."]],
  ["الزبدة خارج النار فقط: عليها تنفصل الكريمة نهائيا.", "Le beurre hors du feu seulement : sur le feu, la crème se dissocie irrémédiablement.", "Butter off the heat only: over the heat the curd splits for good."]);

R("RCP-128", "c8", 2, 10, [25, 240, 0, 0], 850, "g",
  ["عجينة اللوز", "Pâte d'amande", "Almond Paste"],
  ["للتشكيل أو للحشو", "À modeler ou à fourrer", "To model or to fill"],
  "pate amande massepain modelage",
  [["amande_p", 500, "g", "base"], ["sucre_glace", 400, "g", "base"], ["blanc", 2, "pc", "base"],
   ["eau_zhar", 20, "ml", "base", "fix"], ["jus_cit", 10, "ml", "base", "fix"]],
  [["انخل اللوز المطحون والسكر الناعم معا.", "Tamisez ensemble les amandes en poudre et le sucre glace.", "Sift the ground almonds and icing sugar together."],
   ["أضف البياض تدريجيا مع ماء الزهر وعصير الليمون.", "Ajoutez les blancs peu à peu, avec l'eau de fleur d'oranger et le jus de citron.", "Add the whites gradually, with the orange blossom water and lemon juice."],
   ["اعجن باليد حتى تتماسك العجينة دون أن تلتصق.", "Pétrissez à la main jusqu'à une pâte qui tient sans coller.", "Knead by hand to a paste that holds without sticking."],
   ["لفها في غشاء ودعها ترتاح أربع ساعات في البرد.", "Emballez-la et laissez-la reposer quatre heures au frais.", "Wrap it and rest four hours in the fridge."]],
  ["أضف البياض بالملعقة ولا دفعة واحدة: العجينة المفرطة الرطوبة لا تعالج.", "Ajoutez les blancs à la cuillère, jamais d'un coup : trop humide, la pâte est irrécupérable.", "Add the whites by the spoonful, never all at once: too wet, the paste cannot be saved."]);

R("RCP-129", "c8", 1, 10, [15, 0, 0, 0], 750, "g",
  ["حشوة اللوز المغربية", "Farce aux amandes marocaine", "Moroccan Almond Filling"],
  ["لكعب الغزال والمحنشة والبريوات", "Kaab el ghzal, mhencha, briouates", "For gazelle horns, mhencha, briouats"],
  "farce amande kaab mhencha briouate",
  [["amande_p", 500, "g", "base"], ["sucre_glace", 180, "g", "base"], ["cannelle", 5, "g", "base", "fix"],
   ["eau_zhar", 40, "ml", "base"], ["beurre_f", 40, "g", "base"], ["gomme", 1, "g", "base", "fix"]],
  [["اسحق المسكة مع قليل من السكر حتى تصبح مسحوقا.", "Écrasez la gomme arabique avec un peu de sucre jusqu'à obtenir une poudre.", "Crush the gum arabic with a little sugar to a powder."],
   ["اخلط اللوز والسكر والقرفة والمسكة.", "Mélangez les amandes, le sucre, la cannelle et la gomme.", "Mix the almonds, sugar, cinnamon and gum."],
   ["أضف الزبدة المذابة وماء الزهر واعجن حتى تتماسك الحشوة بين الأصابع.", "Ajoutez le beurre fondu et l'eau de fleur d'oranger, travaillez jusqu'à ce que la farce tienne entre les doigts.", "Add the melted butter and orange blossom water, work until the filling holds between your fingers."]],
  ["حشوة متماسكة لا رطبة: المفرطة الرطوبة تثقب العجين أثناء الخبز.", "Une farce qui tient, pas humide : trop mouillée, elle perce la pâte à la cuisson.", "A filling that holds, not wet: too moist and it bursts the pastry as it bakes."]);

R("RCP-130", "c8", 1, 10, [15, 0, 0, 0], 600, "g",
  ["حشوة التمر", "Farce aux dattes", "Date Filling"],
  ["للمقروط والحلويات", "Pour makrout et gâteaux", "For makrout and cakes"],
  "farce datte makrout",
  [["datte", 500, "g", "base"], ["cannelle", 5, "g", "base", "fix"], ["huile", 30, "ml", "base"],
   ["eau_zhar", 20, "ml", "base", "fix"], ["zeste_cit", 5, "g", "base", "root"]],
  [["انزع النوى واقطع التمر خشنا.", "Dénoyautez et hachez grossièrement les dattes.", "Pit the dates and chop them coarsely."],
   ["اهرسها بالخلاط أو في الهاون مع الزيت.", "Écrasez-les au mixeur ou au mortier avec l'huile.", "Blend or pound them with the oil."],
   ["أضف القرفة وقشر الليمون وماء الزهر، ثم اعجن حتى تصبح العجينة لينة ومتجانسة.", "Ajoutez la cannelle, le zeste et l'eau de fleur d'oranger, travaillez jusqu'à une pâte souple et homogène.", "Add the cinnamon, zest and orange blossom water, and work to a smooth, supple paste."]],
  ["إن كان التمر جافا، سخنه دقيقتين على البخار: يعود طريا دون إضافة ماء.", "Dattes un peu sèches ? Passez-les deux minutes à la vapeur : elles redeviennent malléables sans ajout d'eau.", "Dates a little dry? Steam them two minutes: they turn pliable again without adding water."]);

R("RCP-131", "c8", 1, 8, [10, 0, 0, 0], 450, "g",
  ["كريمة الطحينة", "Crème au sésame", "Tahini Cream"],
  ["تغطية مغربية بالعسل", "Nappage marocain au miel", "Moroccan honey topping"],
  "creme tahini sesame miel nappage",
  [["tahin", 200, "g", "base"], ["miel", 120, "g", "base"], ["lait", 100, "ml", "base"],
   ["sucre_glace", 40, "g", "base"], ["eau_zhar", 10, "ml", "base", "fix"]],
  [["حرك الطحينة جيدا في علبتها: الزيت يعلوها دائما.", "Remuez bien le tahini dans son pot : l'huile remonte toujours.", "Stir the tahini well in its jar: the oil always rises."],
   ["اخلطها مع العسل والسكر الناعم.", "Mélangez-le au miel et au sucre glace.", "Mix it with the honey and icing sugar."],
   ["أضف الحليب في تيار رفيع حتى تحصل على قوام سائل ولامع، ثم ماء الزهر.", "Ajoutez le lait en filet jusqu'à une texture coulante et brillante, puis l'eau de fleur d'oranger.", "Add the milk in a thin stream to a glossy, pourable texture, then the orange blossom water."]],
  ["الطحينة تتماسك أولا قبل أن تلين: لا تسكب الحليب كله ظنا أنك أخفقت.", "Le tahini se raidit d'abord avant de se détendre : n'ajoutez pas tout le lait d'un coup en croyant l'avoir raté.", "Tahini seizes before it loosens: do not dump in all the milk thinking you have ruined it."]);

R("RCP-132", "c8", 2, 10, [25, 120, 10, 0], 800, "g",
  ["كريمة موسلين", "Crème mousseline", "Mousseline Cream"],
  ["كريمة الحلواني مخفوقة بالزبدة", "Pâtissière montée au beurre", "Pastry cream whipped with butter"],
  "mousseline creme beurre garniture",
  [["lait", 500, "ml", "base"], ["jaune", 4, "pc", "base"], ["sucre", 110, "g", "base"],
   ["maizena", 45, "g", "base"], ["beurre", 200, "g", "base"], ["vanille_ex", 10, "ml", "base", "fix"]],
  [["حضر كريمة الحلواني مع نصف الزبدة، ثم بردها تماما.", "Préparez une crème pâtissière avec la moitié du beurre, puis refroidissez-la complètement.", "Make a pastry cream with half the butter, then cool it completely."],
   ["اخفق نصف الزبدة الباقي وحده حتى يفتح لونه ويصبح هوائيا.", "Fouettez le reste du beurre seul, jusqu'à ce qu'il blanchisse et devienne aérien.", "Whip the remaining butter on its own until pale and airy."],
   ["أضف الكريمة الباردة إلى الزبدة بالملعقة، مع الخفق المتواصل.", "Incorporez la crème froide au beurre, cuillère par cuillère, sans cesser de fouetter.", "Add the cold cream to the butter a spoonful at a time, whisking constantly."],
   ["استعملها فورا: تتماسك في البرد.", "Utilisez-la aussitôt : elle durcit au froid.", "Use it at once: it firms up when cold."]],
  ["الكريمة والزبدة في نفس الحرارة: أي فرق بينهما يقطع المزيج.", "Crème et beurre à la même température : le moindre écart fait trancher l'appareil.", "Cream and butter at the same temperature: any gap splits the mixture."]);

/* ---------- sirops et sauces ---------- */
R("RCP-133", "c9", 1, 10, [5, 0, 8, 0], 800, "ml",
  ["شراب السكر", "Sirop de sucre", "Sugar Syrup"],
  ["الأساس الذي يخدم كل شيء", "La base à tout faire", "The all-purpose base"],
  "sirop sucre base imbibage",
  [["eau", 500, "ml", "base"], ["sucre", 500, "g", "base"], ["jus_cit", 10, "ml", "base", "fix"]],
  [["اخلط الماء والسكر في قدر وسخن مع التحريك حتى يذوب السكر تماما.", "Réunissez l'eau et le sucre, chauffez en remuant jusqu'à dissolution complète.", "Combine the water and sugar and heat, stirring, until fully dissolved."],
   ["اغل الخليط دقيقتين دون تحريك، ثم أضف عصير الليمون.", "Portez à ébullition deux minutes sans remuer, puis ajoutez le jus de citron.", "Boil for two minutes without stirring, then add the lemon juice."],
   ["اتركه يبرد واحفظه في قنينة في الثلاجة: يبقى شهرا.", "Laissez refroidir et conservez en bouteille au réfrigérateur : il se garde un mois.", "Cool and keep it bottled in the fridge: it lasts a month."]],
  ["عصير الليمون يمنع التبلور: بدونه يتحول الشراب إلى رمل بعد أيام.", "Le jus de citron empêche la cristallisation : sans lui, le sirop tourne en sable après quelques jours.", "The lemon juice stops crystallisation: without it the syrup turns sandy within days."]);

R("RCP-134", "c9", 1, 10, [5, 0, 5, 0], 620, "ml",
  ["شراب العسل وماء الزهر", "Sirop au miel et fleur d'oranger", "Honey & Orange Blossom Syrup"],
  ["للشباكية والبريوات", "Pour chebakia et briouates", "For chebakia and briouats"],
  "sirop miel fleur oranger chebakia",
  [["miel", 500, "g", "base"], ["eau", 150, "ml", "base"], ["eau_zhar", 30, "ml", "base", "fix"],
   ["jus_cit", 10, "ml", "base", "fix"]],
  [["سخن العسل مع الماء على نار هادئة حتى يصبح سائلا، دون أن يغلي.", "Chauffez le miel avec l'eau à feu doux jusqu'à fluidité, sans jamais bouillir.", "Warm the honey with the water over low heat until fluid, never boiling."],
   ["أضف عصير الليمون.", "Ajoutez le jus de citron.", "Add the lemon juice."],
   ["أضف ماء الزهر خارج النار، واستعمل الشراب دافئا.", "Ajoutez l'eau de fleur d'oranger hors du feu, et utilisez tiède.", "Add the orange blossom water off the heat, and use it warm."]],
  ["العسل المغلي يفقد عطره ويقسو: دافئ فقط، دائما.", "Un miel bouilli perd son parfum et durcit : tiède seulement, toujours.", "Boiled honey loses its scent and hardens: warm only, always."]);

R("RCP-135", "c9", 1, 10, [5, 0, 8, 0], 700, "ml",
  ["شراب الورد", "Sirop de rose", "Rose Syrup"],
  ["للحلويات والمشروبات", "Pour desserts et boissons", "For desserts and drinks"],
  "sirop rose eau de rose",
  [["eau", 500, "ml", "base"], ["sucre", 400, "g", "base"], ["eau_ward", 40, "ml", "base", "fix"],
   ["jus_cit", 15, "ml", "base", "fix"]],
  [["أذب السكر في الماء على نار متوسطة.", "Dissolvez le sucre dans l'eau à feu moyen.", "Dissolve the sugar in the water over medium heat."],
   ["اغل دقيقتين، أضف عصير الليمون واتركه يبرد.", "Faites bouillir deux minutes, ajoutez le jus de citron et laissez refroidir.", "Boil two minutes, add the lemon juice and let it cool."],
   ["أضف ماء الورد إلى الشراب البارد.", "Ajoutez l'eau de rose dans le sirop froid.", "Add the rose water to the cold syrup."]],
  ["ماء الورد على البارد: على الساخن لا يبقى منه إلا طعم الصابون.", "L'eau de rose à froid : à chaud, il ne reste qu'un goût de savon.", "Rose water into cold syrup: added hot, only a soapy note survives."]);

R("RCP-136", "c9", 2, 10, [5, 0, 10, 0], 380, "ml",
  ["كراميل سائل", "Caramel liquide", "Liquid Caramel"],
  ["للفلان والتغطية", "Pour flans et nappages", "For flans and toppings"],
  "caramel liquide flan nappage",
  [["sucre", 300, "g", "base"], ["eau", 80, "ml", "base"], ["eau", 100, "ml", "sirop"],
   ["jus_cit", 5, "ml", "base", "fix"]],
  [["ضع السكر مع 80 مل من الماء وعصير الليمون في قدر ذي قاعدة سميكة.", "Mettez le sucre, 80 ml d'eau et le jus de citron dans une casserole à fond épais.", "Put the sugar, 80 ml water and the lemon juice in a heavy pan."],
   ["اطبخ دون تحريك أبدا: حرك القدر نفسه إن لزم الأمر.", "Cuisez sans jamais remuer : contentez-vous d'agiter la casserole si besoin.", "Cook without ever stirring: just swirl the pan if needed."],
   ["حين يصبح اللون عنبريا، أوقف الطبخ بالماء الساخن الباقي، بحذر: المزيج يتطاير.", "Dès la couleur ambrée, décuisez avec le reste d'eau chaude, prudemment : le mélange projette.", "At amber, stop the cooking with the remaining hot water, carefully: it spits."],
   ["أعده إلى النار لحظة ليتجانس، ثم اتركه يبرد.", "Remettez un instant sur le feu pour homogénéiser, puis laissez refroidir.", "Return it briefly to the heat to even out, then cool."]],
  ["ملعقة واحدة من التحريك تكفي لتبلور القدر كله: لا تحرك، أبدا.", "Une seule cuillère remuée suffit à faire cristalliser toute la casserole : ne remuez pas, jamais.", "One stir is enough to crystallise the whole pan: do not stir, ever."]);

R("RCP-137", "c9", 2, 8, [10, 0, 12, 0], 450, "g",
  ["صلصة الكراميل بالزبدة المملحة", "Sauce caramel au beurre salé", "Salted Butter Caramel Sauce"],
  ["كثيفة ولامعة", "Épaisse et brillante", "Thick and glossy"],
  "sauce caramel beurre sale",
  [["sucre", 200, "g", "base"], ["creme", 200, "ml", "base"], ["beurre", 80, "g", "base"],
   ["sel", 4, "g", "base", "root"]],
  [["سخن الكريمة على نار هادئة واتركها جانبا.", "Chauffez la crème à feu doux et réservez-la.", "Warm the cream over low heat and set it aside."],
   ["اطبخ السكر جافا في قدر سميك حتى يصبح كراميلا داكنا.", "Cuisez le sucre à sec dans une casserole épaisse jusqu'à un caramel foncé.", "Cook the sugar dry in a heavy pan to a dark caramel."],
   ["أوقف الطبخ بالكريمة الساخنة، بحذر، مع التحريك.", "Décuisez avec la crème chaude, prudemment, en remuant.", "Stop the cooking with the hot cream, carefully, stirring."],
   ["أضف الزبدة والملح خارج النار واخلط حتى تلمع الصلصة.", "Ajoutez le beurre et le sel hors du feu, mélangez jusqu'à ce que la sauce brille.", "Add the butter and salt off the heat and stir until the sauce shines."]],
  ["كريمة ساخنة على كراميل ساخن: الكريمة الباردة تجمد الكراميل كتلة واحدة.", "Crème chaude sur caramel chaud : une crème froide fige le caramel en bloc.", "Hot cream onto hot caramel: cold cream seizes the caramel into a lump."]);

R("RCP-138", "c9", 1, 8, [5, 0, 6, 0], 500, "ml",
  ["صلصة الشوكولاتة", "Sauce au chocolat", "Chocolate Sauce"],
  ["للمثلجات والحلويات", "Pour glaces et desserts", "For ice creams and desserts"],
  "sauce chocolat nappage glace",
  [["choco_noir", 200, "g", "base"], ["lait", 200, "ml", "base"], ["creme", 80, "ml", "base"],
   ["sucre", 30, "g", "base"], ["beurre", 20, "g", "base"]],
  [["سخن الحليب والكريمة مع السكر حتى الغليان الخفيف.", "Chauffez le lait et la crème avec le sucre jusqu'au frémissement.", "Heat the milk and cream with the sugar to a simmer."],
   ["اسكبهما على الشوكولاتة المقطعة، انتظر دقيقة ثم اخلط.", "Versez sur le chocolat haché, attendez une minute puis lissez.", "Pour over the chopped chocolate, wait a minute, then stir smooth."],
   ["أضف الزبدة: هي التي تعطي اللمعان.", "Ajoutez le beurre : c'est lui qui donne la brillance.", "Add the butter: it is what gives the shine."]],
  ["تقدم دافئة. إن بردت، سخنها على حمام مائي لا على النار المباشرة.", "Se sert tiède. Si elle a refroidi, réchauffez-la au bain-marie et non sur le feu.", "Serve it warm. If it has cooled, reheat over a water bath, never direct heat."]);

R("RCP-139", "c9", 1, 8, [10, 0, 8, 0], 450, "ml",
  ["كوليس الفراولة", "Coulis de fraises", "Strawberry Coulis"],
  ["للسقي، دون طبخ طويل", "À napper, sans longue cuisson", "To pour, barely cooked"],
  "coulis fraise nappage",
  [["fraise", 500, "g", "base"], ["sucre", 100, "g", "base"], ["jus_cit", 20, "ml", "base"]],
  [["اهرس الفراولة مع السكر وعصير الليمون.", "Mixez les fraises avec le sucre et le jus de citron.", "Blend the strawberries with the sugar and lemon juice."],
   ["سخن المزيج خمس دقائق فقط، دون غليان قوي.", "Chauffez cinq minutes seulement, sans forte ébullition.", "Heat for five minutes only, without a hard boil."],
   ["صفه بالمصفاة لإزالة البذور، واتركه يبرد.", "Passez au tamis pour retirer les pépins, et laissez refroidir.", "Sieve to remove the seeds, and let it cool."]],
  ["خمس دقائق لا أكثر: بعدها يصبح مربى ويضيع عطر الفاكهة الطازجة.", "Cinq minutes, pas plus : au-delà, c'est de la confiture et le parfum du fruit frais est perdu.", "Five minutes, no more: beyond that it is jam, and the fresh fruit is gone."]);

R("RCP-141", "c9", 1, 10, [10, 0, 40, 0], 600, "ml",

R("RCP-142", "c5", 1, 8, [15, 180, 12, 0], 8, "pc",
  ["مهلبية", "Mhalabia", "Mhalabia"],
  ["بماء الورد والفستق", "À l'eau de rose et pistaches", "With rose water and pistachios"],
  "mhalabia flan lait ward",
  [["lait", 1000, "ml", "base"], ["maizena", 80, "g", "base"], ["sucre", 120, "g", "base"],
   ["eau_ward", 20, "ml", "base", "fix"], ["pistache", 40, "g", "decor"],
   ["cannelle", 2, "g", "decor", "fix"]],
  [["أذب النشا في كوب من الحليب البارد.", "Délayez la maïzena dans un verre de lait froid.", "Slake the cornstarch in a glass of cold milk."],
   ["سخن باقي الحليب مع السكر، ثم أضف خليط النشا مع التحريك المتواصل.", "Chauffez le reste du lait avec le sucre, puis ajoutez la maïzena en remuant sans arrêt.", "Heat the remaining milk with the sugar, then add the slaked cornstarch, stirring constantly."],
   ["اطبخ حتى يثخن المزيج ويغلي دقيقتين.", "Cuisez jusqu'à épaississement et laissez bouillir deux minutes.", "Cook until thick and let it boil two minutes."],
   ["أضف ماء الورد خارج النار، وزع في الكؤوس وبرد ثلاث ساعات، ثم زين بالفستق والقرفة.", "Ajoutez l'eau de rose hors du feu, répartissez en coupes, réservez trois heures au frais puis décorez de pistaches et de cannelle.", "Add the rose water off the heat, divide into cups, chill three hours, then finish with pistachios and cinnamon."]],
  ["دقيقتان من الغليان: أقل من ذلك يبقى للنشا طعمه، وأكثر يصبح المزيج مطاطيا.", "Deux minutes d'ébullition : moins, la maïzena garde son goût ; plus, la crème devient élastique.", "Two minutes of boiling: less and the cornstarch tastes raw; more and it turns rubbery."]);

R("RCP-143", "c5", 1, 6, [10, 30, 40, 0], 6, "pc",
  ["أرز بالحليب", "Riz au lait à la cannelle", "Cinnamon Rice Pudding"],
  ["حلوى الطفولة", "Le dessert de l'enfance", "A childhood dessert"],
  "riz au lait cannelle",
  [["riz", 150, "g", "base"], ["lait", 1000, "ml", "base"], ["sucre", 100, "g", "base"],
   ["cannelle", 4, "g", "base", "fix"], ["eau_zhar", 15, "ml", "base", "fix"],
   ["beurre", 20, "g", "base"], ["cannelle", 2, "g", "decor", "fix"]],
  [["اغسل الأرز ثم اسلقه خمس دقائق في ماء مغلي وصفه.", "Rincez le riz, blanchissez-le cinq minutes à l'eau bouillante et égouttez.", "Rinse the rice, blanch it five minutes in boiling water and drain."],
   ["اطبخه في الحليب على نار هادئة جدا مع التحريك من حين لآخر، من ثلاثين إلى أربعين دقيقة.", "Cuisez-le dans le lait à feu très doux, en remuant de temps en temps, trente à quarante minutes.", "Cook it in the milk over very low heat, stirring now and then, thirty to forty minutes."],
   ["أضف السكر والقرفة في آخر عشر دقائق.", "Ajoutez le sucre et la cannelle dans les dix dernières minutes.", "Add the sugar and cinnamon in the last ten minutes."],
   ["أضف الزبدة وماء الزهر خارج النار، ووزعه في الكؤوس ورش القرفة.", "Ajoutez le beurre et l'eau de fleur d'oranger hors du feu, répartissez en coupes et poudrez de cannelle.", "Add the butter and orange blossom water off the heat, divide into cups and dust with cinnamon."]],
  ["السكر في آخر الطبخ: مضافا في البداية يمنع الأرز من الانتفاخ ويبقى قاسيا.", "Le sucre en fin de cuisson : ajouté au départ, il empêche le riz de gonfler et le laisse dur.", "Sugar at the end: added early, it stops the rice swelling and leaves it firm."]);

R("RCP-144", "c5", 1, 6, [15, 300, 8, 0], 6, "pc",
  ["بانا كوتا بماء الورد", "Panna cotta à l'eau de rose", "Rose Water Panna Cotta"],
  ["ناعمة وعطرة", "Soyeuse et parfumée", "Silky and fragrant"],

  [["creme", 500, "ml", "base"], ["lait", 200, "ml", "base"], ["sucre", 90, "g", "base"],
   ["gelatine", 8, "g", "base"], ["eau_ward", 25, "ml", "base", "fix"],
   ["framboise", 150, "g", "decor"]],
  [["انقع الجيلاتين في ماء بارد عشر دقائق.", "Réhydratez la gélatine dix minutes dans l'eau froide.", "Soak the gelatin ten minutes in cold water."],
   ["سخن الكريمة والحليب مع السكر حتى الغليان الخفيف، دون غليان قوي.", "Chauffez la crème et le lait avec le sucre jusqu'au frémissement, sans forte ébullition.", "Heat the cream and milk with the sugar to a simmer, without a hard boil."],
   ["أذب الجيلاتين المصفى في الخليط الساخن، ثم أضف ماء الورد.", "Dissolvez la gélatine essorée dans le mélange chaud, puis ajoutez l'eau de rose.", "Dissolve the drained gelatin in the hot mixture, then add the rose water."],
   ["وزع في الكؤوس وبرد خمس ساعات، ثم قدمها مع التوت.", "Répartissez en coupes, réservez cinq heures au frais et servez avec les framboises.", "Divide into glasses, chill five hours and serve with the raspberries."]],
  ["ثمانية غرامات من الجيلاتين لسبعمائة مليلتر: أكثر منها تصبح البانا كوتا مطاطية بدل أن ترتجف.", "Huit grammes de gélatine pour sept cents millilitres : au-delà, la panna cotta devient caoutchouteuse au lieu de trembler.", "Eight grams of gelatin for seven hundred millilitres: more and the panna cotta turns rubbery instead of trembling."]);

R("RCP-145", "c5", 2, 6, [20, 240, 45, 0], 6, "pc",
  ["كريم بروليه", "Crème brûlée", "Crème Brûlée"],
  ["بقشرة الكراميل", "Sous sa croûte de caramel", "Under its caramel crust"],
  "creme brulee vanille caramel",
  [["creme", 500, "ml", "base"], ["jaune", 6, "pc", "base"], ["sucre", 90, "g", "base"],
   ["vanille_g", 1, "pc", "base", "fix"], ["sucre_roux", 60, "g", "decor"]],
  [["اشقق عود الفانيليا وسخنه مع الكريمة، ثم اتركه ينقع نصف ساعة.", "Fendez la gousse, chauffez-la avec la crème et laissez infuser trente minutes.", "Split the pod, heat it with the cream and infuse thirty minutes."],
   ["اخفق الصفار مع السكر دون إدخال هواء.", "Fouettez les jaunes avec le sucre sans incorporer d'air.", "Whisk the yolks with the sugar without beating in air."],
   ["أضف الكريمة الفاترة، صف المزيج وأزل الرغوة من السطح.", "Ajoutez la crème tiède, passez au chinois et retirez l'écume en surface.", "Add the warm cream, strain, and skim off any foam."],
   ["اخبزه في حمام مائي 45 دقيقة على 100 درجة: يجب أن يبقى القلب مرتجفا.", "Cuisez au bain-marie 45 minutes à 100 °C : le cœur doit rester tremblant.", "Bake in a water bath 45 minutes at 100 °C: the centre must stay wobbly."],
   ["برده أربع ساعات، رش السكر البني واحرقه بالشالوميه قبل التقديم مباشرة.", "Réservez quatre heures au frais, saupoudrez de sucre roux et caramélisez au chalumeau juste avant de servir.", "Chill four hours, sprinkle with brown sugar and torch it just before serving."]],
  ["احرق السكر في اللحظة الأخيرة: بعد عشر دقائق تلين القشرة وتذوب.", "Caramélisez au dernier moment : dix minutes plus tard, la croûte a ramolli et fondu.", "Torch it at the last moment: ten minutes later the crust has softened and dissolved."]);

R("RCP-146", "c5", 1, 6, [15, 60, 0, 0], 6, "pc",
  ["سلطة البرتقال بالقرفة", "Salade d'oranges à la cannelle", "Cinnamon Orange Salad"],
  ["ختام خفيف لوجبة ثقيلة", "La fin légère d'un repas lourd", "A light end to a heavy meal"],
  "salade orange cannelle dessert leger",
  [["orange", 8, "pc", "base"], ["cannelle", 5, "g", "base", "fix"], ["sucre_glace", 30, "g", "base"],
   ["eau_zhar", 15, "ml", "base", "fix"], ["amande_m", 30, "g", "decor"],
   ["datte", 60, "g", "decor", "lin", true]],
  [["قشر البرتقال وأزل الجلد الأبيض تماما.", "Pelez les oranges à vif, en retirant toute la peau blanche.", "Peel the oranges to the flesh, removing all the white pith."],
   ["قطعها شرائح رقيقة ورتبها في طبق واسع.", "Coupez-les en fines rondelles et disposez-les dans un plat large.", "Slice them thinly and arrange them on a wide dish."],
   ["رش السكر الناعم وماء الزهر، ثم غط الطبق وبرده ساعة.", "Saupoudrez de sucre glace, arrosez d'eau de fleur d'oranger, couvrez et réservez une heure au frais.", "Dust with icing sugar, sprinkle with orange blossom water, cover and chill one hour."],
   ["رش القرفة واللوز المحمص عند التقديم.", "Poudrez de cannelle et parsemez d'amandes grillées au moment de servir.", "Dust with cinnamon and scatter toasted almonds when serving."]],
  ["القرفة عند التقديم لا قبله: منقوعة ساعة تسود وتترك طعما ترابيا.", "La cannelle au moment de servir, jamais avant : macérée une heure, elle noircit et laisse un goût terreux.", "Cinnamon at serving time, never before: left to steep it darkens and turns earthy."]);

R("RCP-147", "c5", 2, 6, [25, 240, 8, 0], 6, "pc",
  ["موس الليمون", "Mousse au citron", "Lemon Mousse"],
  ["حادة وخفيفة", "Vive et légère", "Sharp and light"],
  "mousse citron leger",
  [["jus_cit", 150, "ml", "base"], ["zeste_cit", 10, "g", "base", "root"], ["sucre", 130, "g", "base"],
   ["oeuf", 4, "pc", "base"], ["gelatine", 8, "g", "base"], ["creme", 250, "ml", "base"]],
  [["انقع الجيلاتين في ماء بارد.", "Réhydratez la gélatine dans l'eau froide.", "Soak the gelatin in cold water."],
   ["افصل البيض، واطبخ الصفار مع السكر وعصير الليمون والقشر على نار هادئة حتى يثخن.", "Séparez les œufs, cuisez les jaunes avec le sucre, le jus et le zeste à feu doux jusqu'à épaississement.", "Separate the eggs, cook the yolks with the sugar, juice and zest over low heat until thick."],
   ["أذب الجيلاتين في الخليط الساخن واتركه يفتر.", "Dissolvez la gélatine dans le mélange chaud et laissez tiédir.", "Dissolve the gelatin in the hot mixture and let it cool to lukewarm."],
   ["اخفق البياض حتى يتماسك، واخفق الكريمة طرية.", "Montez les blancs en neige et fouettez la crème en chantilly souple.", "Whip the whites to peaks and the cream to soft peaks."],
   ["أضف البياض ثم الكريمة برفق، وزع في الكؤوس وبرد أربع ساعات.", "Incorporez les blancs puis la crème délicatement, répartissez en coupes et réservez quatre heures au frais.", "Fold in the whites, then the cream, gently; divide into glasses and chill four hours."]],
  ["أضف البياض والكريمة على خليط فاتر لا ساخن: الحرارة تذيب الرغوة وتضيع الخفة.", "Incorporez blancs et crème sur un appareil tiède, jamais chaud : la chaleur fait retomber la mousse.", "Fold the whites and cream into a lukewarm base, never hot: heat collapses the foam."]);

R("RCP-148", "c4", 1, 10, [20, 30, 18, 0], 40, "pc",
  ["مونتيكاو", "Montecaos", "Montecaos"],
  ["تذوب في الفم", "Fondants à la cannelle", "Melt-in-the-mouth, with cinnamon"],
  "montecaos sable cannelle huile",
  [["farine", 500, "g", "pate"], ["sucre_glace", 200, "g", "pate"], ["huile", 200, "ml", "pate"],
   ["cannelle", 6, "g", "pate", "fix"], ["levure_c", 6, "g", "pate", "root"],
   ["cannelle", 3, "g", "decor", "fix"]],
  [["حمص الدقيق في مقلاة جافة عشر دقائق حتى يذهب لونه قليلا، ثم اتركه يبرد.", "Torréfiez la farine dix minutes à sec, jusqu'à ce qu'elle blondisse à peine, et laissez refroidir.", "Toast the flour dry for ten minutes, until barely golden, and let it cool."],
   ["اخلطه مع السكر الناعم والقرفة والخميرة.", "Mélangez-la au sucre glace, à la cannelle et à la levure.", "Mix it with the icing sugar, cinnamon and baking powder."],
   ["أضف الزيت واعجن قليلا حتى تتماسك العجينة، ثم دعها ترتاح نصف ساعة.", "Ajoutez l'huile et travaillez juste assez pour que la pâte tienne, puis laissez reposer une demi-heure.", "Add the oil and work only until the dough holds, then rest half an hour."],
   ["شكل كرات صغيرة، رش القرفة واخبزها 18 دقيقة على 160 درجة: تبقى فاتحة اللون.", "Formez de petites boules, poudrez de cannelle et enfournez 18 minutes à 160 °C : elles restent pâles.", "Shape small balls, dust with cinnamon and bake 18 minutes at 160 °C: they stay pale."]],
  ["تحميص الدقيق هو كل الفرق: بدونه يبقى للمونتيكاو طعم الدقيق النيء.", "La torréfaction de la farine fait toute la différence : sans elle, le montecao garde un goût de farine crue.", "Toasting the flour makes all the difference: without it the montecao tastes of raw flour."]);

R("RCP-149", "c4", 2, 10, [35, 60, 15, 0], 30, "pc",
  ["بسكويت بالمربى", "Sablés à la confiture", "Jam Sandwich Biscuits"],
  ["بمربى المشمش", "À la confiture d'abricot", "With apricot jam"],

  [["farine", 400, "g", "pate"], ["beurre", 200, "g", "pate"], ["sucre_glace", 120, "g", "pate"],
   ["oeuf", 1, "pc", "pate"], ["sel", 2, "g", "pate", "root"], ["vanille_ex", 5, "ml", "pate", "fix"],
   ["abricot", 250, "g", "farce"], ["sucre", 80, "g", "farce"],
   ["sucre_glace", 40, "g", "decor"]],
  [["افرك الدقيق بالزبدة الباردة بأطراف الأصابع حتى تحصل على رمل خشن.", "Sablez la farine avec le beurre froid du bout des doigts, jusqu'à un sable grossier.", "Rub the flour with the cold butter using your fingertips, to a coarse sand."],
   ["أضف السكر والملح والبيضة والفانيليا، واجمع العجين دون عجن، ثم برده ساعة.", "Ajoutez le sucre, le sel, l'œuf et la vanille, rassemblez sans pétrir et réservez une heure au frais.", "Add the sugar, salt, egg and vanilla, gather without kneading, and chill one hour."],
   ["اطبخ المشمش مع السكر عشر دقائق حتى تحصل على مربى كثيف، ثم اتركه يبرد.", "Cuisez les abricots avec le sucre dix minutes, jusqu'à une confiture épaisse, et laissez refroidir.", "Cook the apricots with the sugar for ten minutes to a thick jam, and cool."],
   ["افرد العجين وقطعه أقراصا، واثقب نصفها في الوسط.", "Étalez la pâte, découpez des disques et évidez le centre de la moitié d'entre eux.", "Roll out the dough, cut discs and cut a hole in the centre of half of them."],
   ["اخبزها 15 دقيقة على 170 درجة، ثم الصق قرصا كاملا بقرص مثقوب بالمربى ورش السكر الناعم.", "Enfournez 15 minutes à 170 °C, assemblez un disque plein et un disque évidé avec la confiture, et poudrez de sucre glace.", "Bake 15 minutes at 170 °C, sandwich a whole disc with a cut-out one using the jam, and dust with icing sugar."]],
  ["زبدة باردة وأصابع سريعة: الزبدة التي تذوب في العجين تعطي بسكويتا قاسيا لا رمليا.", "Beurre froid et doigts rapides : un beurre qui fond dans la pâte donne un biscuit dur, pas sablé.", "Cold butter and quick fingers: butter that melts into the dough gives a hard biscuit, not a crumbly one."]);

R("RCP-150", "c4", 2, 8, [40, 0, 20, 0], 32, "pc",

  [["اخلط اللوز مع السكر والقرفة والزبدة وماء الزهر.", "Mélangez les amandes, le sucre, la cannelle, le beurre et l'eau de fleur d'oranger.", "Mix the almonds, sugar, cinnamon, butter and orange blossom water."],
   ["شكل من الحشوة أصابع رفيعة بطول عشرة سنتيمترات.", "Façonnez la farce en fins boudins de dix centimètres.", "Shape the filling into thin ten-centimetre logs."],
   ["قص ورقة البسطيلة مستطيلات، ضع الحشوة على الحافة ولف بإحكام.", "Découpez la warqa en rectangles, posez la farce sur le bord et roulez serré.", "Cut the warqa into rectangles, lay the filling along one edge and roll tightly."],
   ["الصق الطرف بالبيض المخفوق، ثم اقلها في زيت متوسط حتى تذهب.", "Scellez à l'œuf battu, puis faites frire à feu moyen jusqu'à coloration.", "Seal with beaten egg, then fry over medium heat until golden."],

  ["لف محكم بلا هواء: أي فراغ داخل السيجار ينفتح في الزيت.", "Un roulage serré, sans air : la moindre poche d'air fait éclater le cigare dans l'huile.", "Roll tightly with no air: any trapped pocket bursts the cigar in the oil."]);

  ["حلوة الماكينة", "Biscuits à la machine", "Piped Butter Biscuits"],

    if (val <= d.seuil) return { etat: "compatible", valeur: val, remplaces: [] };
    if (apres <= d.seuil) return { etat: "adaptable", valeur: val, apres: apres, remplaces: dietSubs(r, d) };
    return { etat: "au_dela", valeur: val, apres: apres, remplaces: dietSubs(r, d) };
  }
  return remplaces.length
    ? { etat: "adaptable", remplaces: remplaces }
    : { etat: "compatible", remplaces: [] };
}

/* liste des ingredients que ce régime remplace effectivement dans cette recette */
function dietSubs(r, d) {
  if (!d.subs) return [];
  const out = [];
  r.ings.forEach(function (it) {
    if (it.g === "friture") return;
    if (d.subs[it.i] && out.indexOf(it.i) < 0) out.push(it.i);
  });
  return out;
}

/* recette transformee selon un régime */
function adaptRecipe(r, d) {
  const c = JSON.parse(JSON.stringify(r));
  const gardes = [];
  c.ings.forEach(function (it) {
    const rule = d.subs && d.subs[it.i];
    if (!rule) { gardes.push(it); return; }
    if (rule[0] === null) return;            /* retire */
    it.remplace = it.i;
    it.i = rule[0];
    it.q = Math.round(it.q * rule[1] * 1000) / 1000;
    const gi = ingById(it.i);
    if (gi && unitById(it.u).type !== unitById(gi.unit).type) it.u = gi.unit;
    gardes.push(it);
  });
  c.ings = gardes;
  c.adapte = d.id;
  return c;
}
